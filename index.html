<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#6c45e8">
<title>হিসাবপাতি • Atik Business Hisab</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;background:#f5f6fb;color:#242433}
body{overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer}
.hidden{display:none!important}

:root{
 --primary:#6844e8;
 --primary2:#8b5cf6;
 --deep:#4820a7;
 --bg:#f5f6fb;
 --card:#fff;
 --text:#242433;
 --muted:#777b8b;
 --border:#e5e5ee;
 --green:#20b486;
 --red:#ef5b63;
 --orange:#f59e0b;
 --blue:#3b82f6;
 --pink:#ec4899;
 --shadow:0 8px 28px rgba(53,38,110,.09);
}

.auth-screen{
 min-height:100vh;width:100%;
 display:flex;align-items:center;justify-content:center;
 padding:24px;background:linear-gradient(145deg,#35106d,#6c2bd9,#7c3aed);
}
.auth-card{
 width:min(430px,100%);background:#fff;border-radius:28px;
 padding:30px 24px;box-shadow:0 25px 70px rgba(0,0,0,.25);
}
.auth-art{font-size:64px;text-align:center;margin-bottom:5px}
.auth-title{font-size:30px;font-weight:900;text-align:center;color:#242433;margin:5px 0}
.auth-sub{text-align:center;color:#777;margin-bottom:25px}
.auth-email{background:#f3efff;color:#5d38c9;border-radius:12px;padding:11px 14px;text-align:center;font-weight:800;margin-bottom:18px;word-break:break-all}
.pin-title{text-align:center;font-size:25px;font-weight:900;margin:14px 0 22px}
.pin-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.pin-input{
 width:100%;height:62px;text-align:center;font-size:30px;font-weight:900;
 border:2px solid #e3ddf8;border-radius:15px;outline:none;background:#fff;
}
.pin-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px #eee8ff}
.primary-btn{
 width:100%;padding:14px 18px;border-radius:13px;color:#fff;
 background:linear-gradient(90deg,#6725df,#8c4cf3);font-weight:900;
 box-shadow:0 8px 18px rgba(106,60,230,.25)
}
.text-btn{background:none;color:#673cc9;font-weight:800;padding:12px 0}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:13px;font-weight:800;margin-bottom:6px;color:#55596b}
.form-control{
 width:100%;padding:12px 13px;border:1px solid #dddde8;border-radius:12px;
 background:#fff;outline:none;color:#222
}
.form-control:focus{border-color:var(--primary);box-shadow:0 0 0 3px #eee8ff}
.auth-error{color:#d93645;background:#fff0f2;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.auth-success{color:#087b56;background:#eafaf4;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}

.app{min-height:100vh;background:var(--bg)}
.topbar{
 height:72px;background:linear-gradient(100deg,#6040dc,#7950e9);
 color:#fff;display:flex;align-items:center;padding:0 18px;
 position:sticky;top:0;z-index:30;box-shadow:0 5px 18px rgba(50,35,100,.22)
}
.menu-btn{width:45px;height:45px;border-radius:13px;background:transparent;color:#fff;font-size:27px}
.brand{font-size:28px;font-weight:900;margin-left:8px;flex:1}
.top-actions{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.14);color:#fff;font-size:21px}

.layout{display:flex;min-height:calc(100vh - 72px)}
.sidebar{
 width:270px;background:#fff;border-right:1px solid var(--border);
 position:fixed;left:0;top:72px;bottom:0;overflow:auto;z-index:25;
 padding:14px 10px;transform:translateX(0);transition:.25s
}
.side-group{margin-bottom:6px}
.side-head{
 width:100%;display:flex;align-items:center;justify-content:space-between;
 padding:12px 12px;border-radius:12px;background:#fff;color:#3b3b48;font-weight:900
}
.side-head:hover{background:#f5f1ff;color:var(--primary)}
.side-items{padding:2px 8px 8px 18px}
.side-item{
 display:block;width:100%;text-align:left;padding:10px 11px;
 border-radius:10px;background:none;color:#666879;font-size:14px
}
.side-item:hover,.side-item.active{background:#f0ebff;color:var(--primary);font-weight:800}
.content{width:100%;margin-left:270px;padding:18px;min-width:0}
.page{display:none;max-width:1200px;margin:auto}
.page.active{display:block}

.page-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.page-head h1{font-size:25px;margin:0;font-weight:900}
.back-btn{background:#fff;border:1px solid var(--border);padding:9px 13px;border-radius:11px}
.card{
 background:#fff;border:1px solid var(--border);border-radius:20px;
 box-shadow:var(--shadow);padding:17px
}

.balance-card{
 background:linear-gradient(110deg,#6942e3,#7d4eea);
 color:#fff;border-radius:22px;padding:18px;margin-bottom:14px;
 box-shadow:0 14px 35px rgba(98,58,216,.24)
}
.balance-top{display:flex;justify-content:space-between;align-items:center}
.balance-label{font-size:19px;font-weight:800}
.balance-value{font-size:31px;font-weight:950;margin:3px 0 14px}
.balance-mini{
 background:rgba(255,255,255,.9);color:#4a4b57;border-radius:15px;
 display:grid;grid-template-columns:1fr 1fr;padding:12px
}
.mini-box{padding:2px 15px}
.mini-box+ .mini-box{border-left:1px solid #ddd}
.mini-label{font-size:13px}
.mini-value{font-size:20px;font-weight:900;margin-top:3px}

.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.stat-card{
 background:#fff;border:1px solid var(--border);border-radius:19px;padding:16px;
 min-height:112px;box-shadow:var(--shadow);cursor:pointer
}
.stat-card:hover{transform:translateY(-1px)}
.stat-title{color:#737785;font-size:14px;font-weight:700}
.stat-value{font-size:24px;font-weight:950;margin-top:9px}
.stat-icon{float:right;font-size:27px}
.color-green{border-top:4px solid #20b486}
.color-blue{border-top:4px solid #3b82f6}
.color-red{border-top:4px solid #ef5b63}
.color-orange{border-top:4px solid #f59e0b}
.color-pink{border-top:4px solid #ec4899}
.color-purple{border-top:4px solid #7c3aed}

.section-title{font-size:21px;font-weight:950;margin:24px 0 12px}
.quick-card{padding:18px}
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick-btn{
 padding:14px 8px;border-radius:14px;background:#f0eef6;
 color:#30303c;font-weight:900;font-size:15px
}
.quick-btn.primary{background:linear-gradient(90deg,#7025df,#914cf3);color:#fff}
.quick-btn:active{transform:scale(.98)}

.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:15px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:650px}
th,td{padding:12px 10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}
th{background:#faf8ff;color:#6540b9}
.empty{text-align:center;padding:30px;color:#8a8d99}

.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.toolbar>*{flex:1;min-width:150px}
.action-btn{padding:11px 13px;border-radius:11px;background:#eeeafa;color:#5e35c4;font-weight:800}
.action-btn.green{background:#e7faf4;color:#087c58}
.action-btn.red{background:#fff0f2;color:#c92d3c}
.action-btn.blue{background:#eaf3ff;color:#1e63c5}
.action-btn.dark{background:#292733;color:#fff}

.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.full{grid-column:1/-1}

.mode-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mode-btn{padding:14px;border-radius:13px;background:#f0eef5;font-weight:900}
.mode-btn.active{background:linear-gradient(90deg,#6d2ce0,#9150f1);color:#fff}

.product-row{
 display:grid;grid-template-columns:1.5fr .7fr .9fr .7fr 42px;gap:7px;
 align-items:center;margin-bottom:8px
}
.remove-row{background:#fff0f2;color:#d42f40;border-radius:9px;height:40px}
.sale-total{
 background:#faf8ff;border:1px solid #e7defc;border-radius:16px;padding:15px;margin-top:14px
}
.total-line{display:flex;justify-content:space-between;padding:5px 0}
.total-line.big{font-size:21px;font-weight:950;color:#5832c4}

.check-box{background:#fff8e9;border:1px solid #f6dca3;border-radius:13px;padding:12px;margin-top:10px}

.toggle-row{
 display:flex;justify-content:space-between;align-items:center;
 padding:13px 0;border-bottom:1px solid #eee
}
.toggle{
 width:50px;height:28px;background:#d8d8df;border-radius:20px;padding:3px;transition:.2s
}
.toggle span{display:block;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--primary)}
.toggle.on span{transform:translateX(22px)}

.logo-preview{
 width:82px;height:82px;border-radius:15px;border:1px dashed #cfc9e7;
 display:flex;align-items:center;justify-content:center;overflow:hidden;background:#faf9ff
}
.logo-preview img{width:100%;height:100%;object-fit:contain}

.bottom-nav{
 display:none;position:fixed;bottom:0;left:0;right:0;height:68px;background:#fff;
 border-top:1px solid var(--border);z-index:40;grid-template-columns:repeat(4,1fr)
}
.bottom-nav button{background:none;color:#777;font-size:11px;font-weight:800}
.bottom-nav button.active{color:var(--primary)}
.bottom-nav b{display:block;font-size:21px;margin-bottom:2px}

.fab{
 position:fixed;right:18px;bottom:82px;width:58px;height:58px;border-radius:50%;
 background:linear-gradient(135deg,#6c2ae0,#974ef6);color:#fff;font-size:31px;
 box-shadow:0 12px 25px rgba(104,55,221,.35);z-index:35
}

.sheet-bg{
 position:fixed;inset:0;background:rgba(17,12,34,.42);z-index:80;
 display:none;align-items:flex-end
}
.sheet-bg.open{display:flex}
.sheet{
 width:100%;max-height:82vh;overflow:auto;background:#fff;
 border-radius:28px 28px 0 0;padding:15px 18px 28px;
 animation:up .22s ease
}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.grab{width:70px;height:5px;border-radius:8px;background:#ddd;margin:0 auto 18px}
.sheet-section{margin:16px 0}
.sheet-title{display:flex;align-items:center;gap:8px;color:#7544d4;font-size:19px;font-weight:950}
.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}
.sheet-item{
 padding:11px 5px;background:#faf9fd;border-radius:14px;text-align:center;
 color:#444;font-size:13px;font-weight:800
}
.sheet-item i{display:block;font-size:28px;font-style:normal;margin-bottom:4px}

.modal-bg{
 position:fixed;inset:0;background:rgba(20,16,30,.5);z-index:90;
 display:none;align-items:center;justify-content:center;padding:15px
}
.modal-bg.open{display:flex}
.modal{
 width:min(650px,100%);max-height:92vh;overflow:auto;background:#fff;
 border-radius:22px;padding:18px;box-shadow:0 20px 70px rgba(0,0,0,.3)
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-head h2{margin:0;font-size:21px}
.close-btn{background:#f1eff6;border-radius:10px;width:38px;height:38px}

.toast{
 position:fixed;left:50%;bottom:85px;transform:translateX(-50%) translateY(20px);
 background:#272530;color:#fff;padding:11px 17px;border-radius:12px;
 z-index:200;opacity:0;pointer-events:none;transition:.25s;font-size:13px
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:850px){
 .sidebar{transform:translateX(-105%);box-shadow:10px 0 30px rgba(0,0,0,.12)}
 .sidebar.open{transform:translateX(0)}
 .content{margin-left:0;padding:14px 12px 90px}
 .bottom-nav{display:grid}
 .fab{bottom:82px}
}
@media(max-width:520px){
 .topbar{height:64px;padding:0 10px}
 .sidebar{top:64px}
 .brand{font-size:23px}
 .content{padding:11px 10px 92px}
 .stat-grid{gap:9px}
 .stat-card{padding:13px;min-height:100px;border-radius:16px}
 .stat-value{font-size:20px}
 .balance-card{border-radius:18px;padding:15px}
 .balance-value{font-size:27px}
 .mini-box{padding:2px 8px}
 .mini-value{font-size:17px}
 .quick-card{padding:12px}
 .quick-grid{gap:7px}
 .quick-btn{padding:12px 4px;font-size:13px}
 .form-grid,.form-grid.three{grid-template-columns:1fr}
 .product-row{grid-template-columns:1.3fr .55fr .8fr 38px}
 .product-row .price-cell{grid-column:2/4}
 .product-row .line-total{grid-column:2/4}
 .product-row .remove-row{grid-column:4;grid-row:1/3}
 .sheet-grid{grid-template-columns:repeat(3,1fr)}
 .page-head h1{font-size:21px}
}

@media print{
 body{background:#fff}
 .app,.modal-bg,.sheet-bg,.toast{display:none!important}
}
</style>
</head>

<body>

<div id="authScreen" class="auth-screen">
 <div id="authCard" class="auth-card"></div>
</div>

<div id="app" class="app hidden">
 <header class="topbar">
  <button class="menu-btn" onclick="toggleSidebar()">☰</button>
  <div class="brand">🏠 হিসাবপাতি</div>
  <div class="top-actions">
   <button class="icon-btn" onclick="openPage('reports')">◔</button>
   <button class="icon-btn" onclick="signOutUser()">⎋</button>
  </div>
 </header>

 <aside id="sidebar" class="sidebar">
  <div class="side-group">
   <button class="side-head" onclick="openPage('dashboard')">🏠 ড্যাশবোর্ড</button>
  </div>

  <div class="side-group">
   <button class="side-head" onclick="toggleGroup('salesGroup')">🛒 বিক্রয় <span>⌄</span></button>
   <div id="salesGroup" class="side-items">
    <button class="side-item" onclick="openPage('sales')">বিক্রয়</button>
    <button class="side-item" onclick="openPage('salesReturn')">বিক্রয় রিটার্ন</button>
    <button class="side-item" onclick="openPage('collection')">বাকি আদায়</button>
   </div>
  </div>

  <div class="side-group">
   <button class="side-head" onclick="toggleGroup('purchaseGroup')">📦 ক্রয় <span>⌄</span></button>
   <div id="purchaseGroup" class="side-items">
    <button class="side-item" onclick="openPage('purchases')">ক্রয়</button>
    <button class="side-item" onclick="openPage('purchaseReturn')">ক্রয় রিটার্ন</button>
    <button class="side-item" onclick="openPage('payment')">বাকি পরিশোধ</button>
   </div>
  </div>

  <div class="side-group">
   <button class="side-head" onclick="toggleGroup('orderGroup')">📋 অর্ডার <span>⌄</span></button>
   <div id="orderGroup" class="side-items">
    <button class="side-item" onclick="openPage('salesOrders')">বিক্রয় অর্ডার</button>
    <button class="side-item" onclick="openPage('purchaseOrders')">ক্রয় অর্ডার</button>
   </div>
  </div>

  <div class="side-group">
   <button class="side-head" onclick="openPage('dues')">💰 বাকির হিসাব</button>
  </div>

  <div class="side-group">
   <button class="side-head" onclick="toggleGroup('expenseGroup')">💸 ব্যয়/খরচ <span>⌄</span></button>
   <div id="expenseGroup" class="side-items">
    <button class="side-item" onclick="openPage('expenses')">ব্যয় সমূহ</button>
   </div>
  </div>

  <div class="side-group">
   <button class="side-head" onclick="openPage('cashbank')">🏦 ব্যাংক লেনদেন</button>
   <div class="side-items">
    <button class="side-item" onclick="openPage('cashbank')">ব্যাংক লেনদেন</button>
    <button class="side-item" onclick="openPage('banks')">ব্যাংক সমূহ</button>
    <button class="side-item" onclick="openPage('cashbank')">ক্যাশ মিলাই</button>
   </div>
  </div>

  <div class="side-group">
   <button class="side-head" onclick="openPage('reports')">📊 রিপোর্টস</button>
  </div>

  <div class="side-group">
   <button class="side-head" onclick="toggleGroup('productGroup')">📦 পণ্য <span>⌄</span></button>
   <div id="productGroup" class="side-items">
    <button class="side-item" onclick="openPage('products')">পণ্য সমূহ</button>
    <button class="side-item" onclick="openPage('stock')">স্টক পরিবর্তন</button>
    <button class="side-item" onclick="openPage('barcode')">বারকোড জেনারেটর</button>
   </div>
  </div>

  <div class="side-group">
   <button class="side-head" onclick="openPage('parties')">👥 পার্টি</button>
  </div>

  <div class="side-group">
   <button class="side-head" onclick="openPage('messages')">💬 মেসেজ কিনি</button>
  </div>

  <div class="side-group">
   <button class="side-head" onclick="openPage('utilities')">🧰 ইউটিলিটি</button>
  </div>

  <div class="side-group">
   <button class="side-head" onclick="openPage('referral')">🎁 রেফার এবং আয়</button>
  </div>

  <div class="side-group">
   <button class="side-head" onclick="openPage('settings')">⚙️ সেটিংস</button>
  </div>

  <div class="side-group">
   <button class="side-head" onclick="showPackage()">⭐ বর্তমান প্যাকেজ</button>
  </div>

  <div class="side-group">
   <button class="side-head">📱 অ্যাপ ভার্সন <span>১.০.০</span></button>
  </div>
 </aside>

 <main class="content">

  <section id="page-dashboard" class="page active"></section>
  <section id="page-sales" class="page"></section>
  <section id="page-purchases" class="page"></section>
  <section id="page-products" class="page"></section>
  <section id="page-customers" class="page"></section>
  <section id="page-suppliers" class="page"></section>
  <section id="page-expenses" class="page"></section>
  <section id="page-cashbank" class="page"></section>
  <section id="page-reports" class="page"></section>
  <section id="page-settings" class="page"></section>
  <section id="page-dues" class="page"></section>
  <section id="page-salesReturn" class="page"></section>
  <section id="page-purchaseReturn" class="page"></section>
  <section id="page-collection" class="page"></section>
  <section id="page-payment" class="page"></section>
  <section id="page-salesOrders" class="page"></section>
  <section id="page-purchaseOrders" class="page"></section>
  <section id="page-banks" class="page"></section>
  <section id="page-stock" class="page"></section>
  <section id="page-barcode" class="page"></section>
  <section id="page-parties" class="page"></section>
  <section id="page-messages" class="page"></section>
  <section id="page-utilities" class="page"></section>
  <section id="page-referral" class="page"></section>

 </main>

 <nav class="bottom-nav">
  <button onclick="openPage('dashboard')" class="active"><b>⌂</b>হোম</button>
  <button onclick="openPage('sales')"><b>🛒</b>বিক্রয়</button>
  <button onclick="openPage('products')"><b>📦</b>পণ্য</button>
  <button onclick="openPage('settings')"><b>⚙</b>সেটিংস</button>
 </nav>

 <button class="fab" onclick="openQuickSheet()">+</button>
</div>

<div id="quickSheetBg" class="sheet-bg" onclick="closeQuickSheet(event)">
 <div class="sheet" onclick="event.stopPropagation()">
  <div class="grab"></div>

  <div class="sheet-section">
   <div class="sheet-title">🛒 বিক্রয়</div>
   <div class="sheet-grid">
    <button class="sheet-item" onclick="openPage('sales');closeQuickSheet()"><i>🛒</i>বিক্রয়</button>
    <button class="sheet-item" onclick="openPage('salesReturn');closeQuickSheet()"><i>↩️</i>বিক্রয় রিটার্ন</button>
    <button class="sheet-item" onclick="openPage('collection');closeQuickSheet()"><i>💰</i>বাকি আদায়</button>
   </div>
  </div>

  <div class="sheet-section">
   <div class="sheet-title">📦 ক্রয়</div>
   <div class="sheet-grid">
    <button class="sheet-item" onclick="openPage('purchases');closeQuickSheet()"><i>📥</i>ক্রয়</button>
    <button class="sheet-item" onclick="openPage('purchaseReturn');closeQuickSheet()"><i>↩️</i>ক্রয় রিটার্ন</button>
    <button class="sheet-item" onclick="openPage('payment');closeQuickSheet()"><i>💸</i>বাকি পরিশোধ</button>
   </div>
  </div>

  <div class="sheet-section">

function pinPassword(email,pin){

}

function readPin(id="pin"){

}
function wirePinBoxes(id="pin"){
 const boxes=[0,1,2,3].map(i=>document.getElementById(id+i));
 boxes.forEach((b,i)=>{
  b?.addEventListener("input",()=>{
   b.value=b.value.replace(/\D/g,"").slice(0,1);
   if(b.value&&boxes[i+1]) boxes[i+1].focus();
  });
  b?.addEventListener("keydown",e=>{
   if(e.key==="Backspace"&&!b.value&&boxes[i-1]) boxes[i-1].focus();
  });
 });
 boxes[0]?.focus();
}

 const pin=readPin("setup"),confirm=readPin("confirm");
 if(!/^\d{4}$/.test(pin)){authMessage("৪ সংখ্যার PIN দিন।","error");return}
 if(pin!==confirm){authMessage("দুইটি PIN একই নয়।","error");return}
 try{
  await createUserWithEmailAndPassword(auth,email,pinPassword(email,pin));
  db=clone(defaultDB);
  db.profile.email=email;
  saveDB();
  toast("অ্যাকাউন্ট তৈরি হয়েছে");
 }catch(e){authMessage(errorText(e),"error")}
}

}

  showResetPin(email,code);
  return true;
 }catch(e){

 }
}

async function finishReset(codeEncoded,emailEncoded){

 try{
  await confirmPasswordReset(auth,code,pinPassword(email,pin));
  setSavedEmail(email);
  document.getElementById("authCard").innerHTML=`

}

function todaySales(){return db.sales.filter(x=>x.date===today())}
function todayPurchases(){return db.purchases.filter(x=>x.date===today())}
function todayExpenses(){return db.expenses.filter(x=>x.date===today())}
function salesTotal(arr=db.sales){return arr.reduce((a,x)=>a+num(x.total),0)}
function purchaseTotal(arr=db.purchases){return arr.reduce((a,x)=>a+num(x.total),0)}
function expenseTotal(arr=db.expenses){return arr.reduce((a,x)=>a+num(x.amount),0)}
function customerDue(c){
 return db.sales.filter(x=>x.customer===c).reduce((a,x)=>a+num(x.due),0)-
 db.transactions.filter(x=>x.type==="collection"&&x.party===c).reduce((a,x)=>a+num(x.amount),0);
}
function supplierDue(c){
 return db.purchases.filter(x=>x.supplier===c).reduce((a,x)=>a+num(x.due),0)-
 db.transactions.filter(x=>x.type==="payment"&&x.party===c).reduce((a,x)=>a+num(x.amount),0);
}
function cashBalance(){
 let v=0;
 db.sales.forEach(x=>{
  if(x.method==="ব্যাংক ট্রান্সফার"||x.method==="চেক")return;
  v+=num(x.paid);
 });
 db.purchases.forEach(x=>v-=num(x.paid));
 db.expenses.forEach(x=>v-=num(x.amount));
 db.transactions.forEach(x=>{
  if(x.type==="collection")v+=num(x.amount);
  if(x.type==="payment")v-=num(x.amount);
  if(x.type==="cashIn")v+=num(x.amount);
  if(x.type==="cashOut")v-=num(x.amount);
 });
 return v;
}
function bankBalance(){
 let v=0;
 db.sales.forEach(x=>{if(x.method==="ব্যাংক ট্রান্সফার"||x.method==="চেক")v+=num(x.paid)});
 db.transactions.forEach(x=>{
  if(x.account==="bank"&&["bankIn","transferIn"].includes(x.type))v+=num(x.amount);
  if(x.account==="bank"&&["bankOut","transferOut"].includes(x.type))v-=num(x.amount);
 });
 return v;
}
function totalReceivable(){return db.customers.reduce((a,c)=>a+Math.max(0,customerDue(c.name)),0)}
function totalPayable(){return db.suppliers.reduce((a,c)=>a+Math.max(0,supplierDue(c.name)),0)}
function stockValue(){return db.products.reduce((a,p)=>a+num(p.stock)*num(p.price),0)}
function lowStock(){return db.products.filter(p=>num(p.stock)<=num(p.limit||5))}

window.toggleBalanceText=btn=>{
 const cards=document.querySelectorAll(".balance-value");
 const hidden=btn.dataset.hidden==="1";
 cards.forEach(x=>x.textContent=hidden?x.dataset.value:"••••••");

};

function toggleHTML(path,label,value){
 const safe=path.replace(/\./g,"_");
 return `<div class="toggle-row"><span>${label}</span><button class="toggle ${value?"on":""}" onclick="toggleSetting('${path}',this)"><span></span></button></div>`;
}

window.toggleSetting=(path,btn)=>{
 const parts=path.split(".");
 let obj=db.settings;
 for(let i=0;i<parts.length-1;i++)obj=obj[parts[i]];
 const k=parts[parts.length-1];
 obj[k]=!obj[k];
 btn.classList.toggle("on",obj[k]);
 saveDB();
};

 r.readAsDataURL(f);
};

function setSaleMode(mode){
 document.getElementById("cashMode").classList.toggle("active",mode==="cash");
 document.getElementById("creditMode").classList.toggle("active",mode==="credit");
 document.getElementById("salePaid").value=mode==="cash"?calculateSaleTotal():0;
 updateSaleTotal();
}
window.setSaleMode=setSaleMode;

}

function renderSaleItems(){
 const el=document.getElementById("saleItems");if(!el)return;
 el.innerHTML=saleItems.map((x,i)=>`
 <div class="product-row">
  <select class="form-control" onchange="selectSaleProduct(${i},this.value)">
   <option value="">পণ্য</option>${db.products.map(p=>`<option value="${p.id}" ${p.id===x.productId?"selected":""}>${esc(p.name)}</option>`).join("")}
  </select>
  <input class="form-control" type="number" min="0.01" step="0.01" value="${x.qty}" oninput="saleItems[${i}].qty=num(this.value);updateSaleTotal()">
  <input class="form-control price-cell" type="number" min="0" step="0.01" value="${x.price}" oninput="saleItems[${i}].price=num(this.value);updateSaleTotal()">

}
window.selectSaleProduct=(i,id)=>{
 const p=db.products.find(x=>x.id===id);
 saleItems[i].productId=id;
 saleItems[i].price=p?num(p.price):0;
 renderSaleItems();updateSaleTotal();
};
window.removeSaleItem=i=>{saleItems.splice(i,1);renderSaleItems();updateSaleTotal()};

function calculateSaleTotal(){
 const sub=saleItems.reduce((a,x)=>a+num(x.qty)*num(x.price),0);
 return Math.max(0,sub-num(document.getElementById("saleDiscount")?.value));
}
function updateSaleTotal(){
 const sub=saleItems.reduce((a,x)=>a+num(x.qty)*num(x.price),0);
 const dis=num(document.getElementById("saleDiscount")?.value);
 const total=Math.max(0,sub-dis);
 const paid=Math.min(total,Math.max(0,num(document.getElementById("salePaid")?.value)));
 const due=Math.max(0,total-paid);
 const customer=document.getElementById("saleCustomer")?.value;
 const old=customer?Math.max(0,customerDue(customer)):0;
 document.getElementById("saleSubtotal")&&(document.getElementById("saleSubtotal").textContent=money(sub));
 document.getElementById("saleTotal")&&(document.getElementById("saleTotal").textContent=money(total));
 document.getElementById("saleDue")&&(document.getElementById("saleDue").textContent=money(due));
 const box=document.getElementById("previousDueBox");
 if(box)box.innerHTML=customer?`<div class="total-line"><span>আগের বাকি</span><b>${money(old)}</b></div><div class="total-line big"><span>মোট বকেয়া</span><b>${money(old+due)}</b></div>`:"";
}
window.updateSaleTotal=updateSaleTotal;

function renderPaymentMethods(){
 const el=document.getElementById("paymentMethods");if(!el)return;
 const s=db.settings.paymentMethods;
 const methods=[
  ["cash","নগদ"],
  ["cashSale","নগদ বিক্রি"],
  ["bank","ব্যাংক ট্রান্সফার"],
  ["check","চেক"]
 ].filter(x=>s[x[0]]);
 if(!methods.length){el.innerHTML="<div class='empty'>সেটিংস থেকে অন্তত একটি পেমেন্ট পদ্ধতি চালু করুন</div>";return}
 el.innerHTML=`<div class="form-grid">${methods.map((m,i)=>`<label class="card" style="padding:11px;cursor:pointer"><input type="radio" name="saleMethod" value="${m[1]}" ${i===0?"checked":""} onchange="showCheckFields()"> ${m[1]}</label>`).join("")}</div>`;
}

   <div class="form-group"><label>চেক নম্বর</label><input id="checkNo" class="form-control"></div>
   <div class="form-group"><label>ব্যাংকের নাম</label><input id="checkBank" class="form-control"></div>
   <div class="form-group"><label>চেকের তারিখ</label><input id="checkDate" class="form-control" type="date"></div>
  </div>
 </div>`:"";
};

async function saveSale(){
 if(!saleItems.length)return toast("অন্তত একটি পণ্য দিন");
 const valid=saleItems.filter(x=>x.productId&&num(x.qty)>0);
 if(!valid.length)return toast("পণ্য নির্বাচন করুন");
 const customer=document.getElementById("saleCustomer").value;
 const subtotal=valid.reduce((a,x)=>a+num(x.qty)*num(x.price),0);
 const discount=Math.max(0,num(document.getElementById("saleDiscount").value));
 const total=Math.max(0,subtotal-discount);
 const paid=Math.min(total,Math.max(0,num(document.getElementById("salePaid").value)));
 const due=Math.max(0,total-paid);
 const method=document.querySelector('input[name="saleMethod"]:checked')?.value||"নগদ";
 const previousDue=customer?Math.max(0,customerDue(customer)):0;
 const sale={
  id:uid(),
  invoiceNo:document.getElementById("saleInvoice").value,
  date:document.getElementById("saleDate").value,
  created:Date.now(),
  customer,
  items:valid.map(x=>{
   const p=db.products.find(z=>z.id===x.productId);
   return {productId:x.productId,name:p?.name||"",qty:num(x.qty),price:num(x.price),total:num(x.qty)*num(x.price),unit:p?.unit||""}
  }),
  subtotal,discount,total,paid,due,previousDue,method,
  checkNo:document.getElementById("checkNo")?.value||"",
  checkBank:document.getElementById("checkBank")?.value||"",
  checkDate:document.getElementById("checkDate")?.value||""
 };
 sale.items.forEach(i=>{
  const p=db.products.find(x=>x.id===i.productId);
  if(p)p.stock=Math.max(0,num(p.stock)-i.qty);
 });
 db.sales.push(sale);
 saveDB();
 closeModal();
 toast("বিক্রয় সফলভাবে সংরক্ষণ হয়েছে");
 printInvoice(sale);
}

window.saveSale=saveSale;

 const r=new FileReader();
 r.onload=()=>{

   if(!x.profile||!x.products)throw new Error();
   db=Object.assign(clone(defaultDB),x);
   saveDB();toast("ডেটা ফিরিয়ে আনা হয়েছে");
  }catch(e){toast("ব্যাকআপ ফাইল সঠিক নয়")}
 };

};

function amountWordsBD(value){
 let n=Math.round(Number(value||0)*100);
 const taka=Math.floor(n/100),poisha=n%100;
 const ones=["","এক","দুই","তিন","চার","পাঁচ","ছয়","সাত","আট","নয়"];
 const tens=["","","বিশ","ত্রিশ","চল্লিশ","পঞ্চাশ","ষাট","সত্তর","আশি","নব্বই"];
 const below100=n=>{
  if(n<10)return ones[n];
  if(n<20){
   const a=["দশ","এগারো","বারো","তেরো","চৌদ্দ","পনেরো","ষোল","সতেরো","আঠারো","উনিশ"];
   return a[n-10];
  }
  return tens[Math.floor(n/10)]+(n%10?" "+ones[n%10]:"");
 };
 const under1000=n=>{
  if(n<100)return below100(n);
  return ones[Math.floor(n/100)]+" শত"+(n%100?" "+below100(n%100):"");
 };
 const words=n=>{
  if(n===0)return "শূন্য";
  let out="";
  if(n>=10000000){out+=words(Math.floor(n/10000000))+" কোটি ";n%=10000000}
  if(n>=100000){out+=words(Math.floor(n/100000))+" লাখ ";n%=100000}
  if(n>=1000){out+=words(Math.floor(n/1000))+" হাজার ";n%=1000}
  if(n)out+=under1000(n);
  return out.trim();
 };
 let result=words(taka)+" টাকা";
 if(poisha)result+=" "+words(poisha)+" পয়সা";
 return result+" মাত্র";
}
