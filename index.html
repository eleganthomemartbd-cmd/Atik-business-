<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Noto Sans Bengali","Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.top{height:62px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:flex;align-items:center;gap:8px;padding:0 10px;position:sticky;top:0;z-index:40;box-shadow:0 3px 15px #0002}.ib{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:inherit;font-size:23px}.ib:hover{background:#fff2}.brand{font-size:21px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{font-size:10px;opacity:.8}.sp{flex:1}.main{max-width:1200px;margin:auto;padding:16px 12px 105px}.pagehead{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;margin:-16px -12px 14px;padding:13px 10px;font-size:20px;font-weight:900}.pagehead button{color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.balance{grid-column:1/-1;background:linear-gradient(145deg,var(--p),#7658F5);color:#fff;border-radius:18px;padding:15px;box-shadow:var(--shadow)}.balance-title{text-align:center;font-weight:800}.big{font-size:30px;text-align:center;font-weight:900;margin:3px 0 12px}.cashrow{display:grid;grid-template-columns:1fr 1fr;background:#fff;color:var(--text);border-radius:14px;padding:11px}.cashrow>div+div{border-left:1px solid #eee}.cashrow div{padding:0 12px}.label{font-size:12px;color:var(--muted)}.value{font-size:21px;font-weight:900;margin-top:2px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 4px 18px #4b426c0a;margin-bottom:11px}.stat{min-height:104px;position:relative}.dot{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;font-size:20px;margin:-27px 0 7px 0;border:6px solid var(--bg)}.dot.g{background:var(--gs);color:var(--g)}.dot.r{background:var(--rs);color:var(--r)}.dot.b{background:var(--bs);color:var(--b)}.dot.o{background:var(--os);color:var(--o)}.dot.p{background:var(--ps);color:var(--p)}.stat h3{font-size:14px;margin:0 0 3px}.stat strong{font-size:19px}.wide{grid-column:1/-1;display:flex;align-items:center;gap:12px}.wide .dot{margin:0}.bottom{position:fixed;bottom:0;left:0;right:0;height:78px;background:#fff;border-top:1px solid var(--line);z-index:35;display:flex;align-items:center;justify-content:space-around;box-shadow:0 -7px 24px #0001}.pill{border:0;color:#fff;border-radius:28px;padding:11px 20px;font-weight:900;min-width:105px}.buy{background:linear-gradient(135deg,#B85DF3,#9456ED)}.sell{background:linear-gradient(135deg,#3998F5,#3287E9)}.fab{width:62px;height:62px;border-radius:50%;border:5px solid #E8E3FF;background:#fff;color:var(--p);font-size:35px;box-shadow:0 8px 20px #0002;margin-top:-25px}.drawer-bg,.backdrop{position:fixed;inset:0;background:#0008;z-index:70}.drawer{position:fixed;left:0;top:0;bottom:0;width:min(420px,88vw);background:#fff;z-index:75;overflow:auto;transform:translateX(-102%);transition:.22s;box-shadow:12px 0 35px #0003}.drawer.open{transform:none}.dhead{background:linear-gradient(145deg,var(--p),#7B5AF7);color:#fff;padding:18px 15px}.profile{display:flex;gap:11px;align-items:center}.avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#fff2;font-size:26px}.pname{font-size:18px;font-weight:900}.pemail{font-size:11px;opacity:.8}.menu{padding:10px}.mi{width:100%;border:0;background:transparent;text-align:left;display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;font-size:15px;color:var(--text)}.mi:hover{background:var(--ps);color:var(--p);font-weight:800}.micon{width:28px;text-align:center;font-size:20px}.dfoot{padding:14px;border-top:1px dashed var(--line)}.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:min(760px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;z-index:85;transition:.22s;padding:13px 16px 28px;box-shadow:0 -12px 35px #0003}.sheet.open{transform:translate(-50%,0)}.handle{width:70px;height:5px;background:#ddd8f2;border-radius:4px;margin:2px auto 16px}.sheet h2{text-align:center;color:var(--p);font-size:20px}.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick{border:0;background:#fff;padding:10px 4px;border-radius:14px;text-align:center}.quick:hover{background:var(--ps)}.quick b{font-size:28px;display:block}.quick span{font-size:12px}.sectiontitle{display:flex;gap:8px;align-items:center;color:var(--p);font-weight:900;margin:16px 0 8px}.sectiontitle:before,.sectiontitle:after{content:"";height:1px;border-top:1px dashed #ddd8f0;flex:1}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:4px;color:#666370}.field input,.field select,.field textarea,.search input{width:100%;border:1px solid #D8D5E2;border-radius:10px;padding:10px 11px;background:#fff;color:var(--text);outline:0}.field input:focus,.field select:focus,.field textarea:focus,.search input:focus{border-color:var(--p);box-shadow:0 0 0 3px #6c5ce71c}.full{grid-column:1/-1}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:850}.primary{background:var(--p);color:#fff}.secondary{background:var(--ps);color:var(--p)}.danger{background:var(--rs);color:#C43D4A}.green{background:var(--gs);color:#16885B}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:9px;border-bottom:1px solid var(--line);font-size:12px;text-align:left;white-space:nowrap}th{background:#FAF9FE;color:#625F6D}.badge{display:inline-flex;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:900}.badge.g{background:var(--gs);color:#16885B}.badge.r{background:var(--rs);color:#C43D4A}.badge.o{background:var(--os);color:#9A670C}.badge.b{background:var(--bs);color:#2673C8}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px}.kpi small{color:var(--muted)}.kpi strong{display:block;font-size:19px;margin-top:3px}.search{position:relative;flex:1;min-width:180px}.search span{position:absolute;right:12px;top:9px}.modal{position:fixed;inset:0;background:#0008;z-index:90;display:flex;align-items:center;justify-content:center;padding:14px}.modalbox{width:min(820px,100%);max-height:92vh;background:#fff;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px #0005}.mhead{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line)}.mhead h2{font-size:19px;margin:0;color:var(--p)}.mbody{padding:15px;overflow:auto}.mfoot{padding:11px 15px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,15px);opacity:0;background:#292731;color:#fff;padding:10px 15px;border-radius:12px;z-index:120;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.auth{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(145deg,#6C5CE7,#8B70FF)}.authbox{width:min(430px,100%);background:#fff;border-radius:20px;padding:22px;box-shadow:0 20px 60px #0003}.logo{text-align:center;color:var(--p);font-size:34px;font-weight:950}.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px}.tabs{display:flex;background:var(--ps);border-radius:24px;padding:3px;margin-bottom:15px}.tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:20px}.tabs .sel{background:#fff;color:var(--p);font-weight:900}.authmsg{color:var(--r);font-size:12px;text-align:center;margin-top:10px;min-height:18px}.payments{border:1px solid var(--line);border-radius:12px;overflow:hidden}.payrow{display:grid;grid-template-columns:1fr 130px 38px;gap:7px;padding:8px;border-bottom:1px solid var(--line)}.payrow:last-child{border-bottom:0}.payrow select,.payrow input{width:100%;padding:8px;border:1px solid #ddd9e8;border-radius:9px}.txrow{border:1px solid var(--line);border-radius:12px;padding:9px;margin:8px 0}.invoice{background:#fff;border:1px solid var(--line);max-width:850px;margin:auto;padding:22px}.invoicehead{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid var(--p);padding-bottom:10px}.invtitle{font-size:23px;font-weight:950;color:var(--p)}.right{text-align:right}.totalbig{font-size:22px;font-weight:950;color:var(--p)}.empty{text-align:center;color:var(--muted);padding:25px}.notice{padding:10px 12px;background:var(--os);border-radius:10px;font-size:12px}.plan{border:2px solid var(--line);border-radius:15px;padding:14px}.plan.feature{border-color:var(--p);box-shadow:var(--shadow)}.price{font-size:25px;font-weight:950;color:var(--p)}
@media(min-width:700px){.main{padding-left:24px;padding-right:24px}.grid{grid-template-columns:repeat(4,1fr)}.bottom{width:min(720px,100%);left:50%;right:auto;transform:translateX(-50%);border-radius:25px 25px 0 0}.qgrid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:600px){.main{padding:15px 10px 105px}.pagehead{margin:-15px -10px 13px}.brand{font-size:20px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.kpis{grid-template-columns:1fr 1fr}.payrow{grid-template-columns:1fr 105px 35px}.invoice{padding:12px}.invoicehead{display:block}.right{text-align:left;margin-top:8px}.qgrid{gap:5px}.pill{padding:10px 11px;min-width:95px;font-size:12px}}
@media(max-width:370px){.pill{min-width:85px;padding:9px 7px}.brand small{display:none}.cashrow div{padding:0 7px}}
@media print{.top,.bottom,.pagehead,.actions,.no-print{display:none!important}.main{padding:0!important}.invoice{border:0!important;max-width:none!important}.modal{position:static!important;background:#fff!important}.modalbox{box-shadow:none!important;max-height:none!important}}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div><div id="layers"></div>
<script>
const KEY='hisabbati_final_v1';const now=()=>new Date().toISOString();const today=()=>new Date().toISOString().slice(0,10);const uid=(p='ID')=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);const n=x=>Math.max(0,Number(x)||0);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=x=>(db.settings?.currency||'৳')+' '+n(x).toLocaleString('bn-BD',{minimumFractionDigits:2,maximumFractionDigits:2});
const blank={session:null,business:null,users:[],products:[],parties:[],sales:[],purchases:[],expenses:[],payments:[],stockMoves:[],cashTx:[],bankAccounts:[],bankTx:[],orders:[],audit:[],notifications:[],settings:{currency:'৳',tax:0,delivery:0,paymentMethods:{cash:true,bank:true,cheque:true,bKash:true,nagad:true,rocket:true}} ,plan:'Basic',sync:{status:'local'}};
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(!x)return structuredClone(blank);return merge(x)}catch{return structuredClone(blank)}}function merge(x){let d=structuredClone(blank);Object.keys(d).forEach(k=>{if(Array.isArray(d[k]))d[k]=Array.isArray(x[k])?x[k]:d[k];else if(d[k]&&typeof d[k]==='object')d[k]={...d[k],...(x[k]||{})};else if(x[k]!==undefined)d[k]=x[k]});return d}let db=load();
function save(){localStorage.setItem(KEY,JSON.stringify(db));if(window.cloudSync)window.cloudSync(db).catch(()=>{})}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}function audit(action,ref,detail=''){db.audit.push({id:uid('AUD'),action,ref,detail,userId:db.session?.userId||null,createdAt:now()})}
function party(id){return db.parties.find(x=>x.id===id)}function product(id){return db.products.find(x=>x.id===id)}function stock(p){if(!p)return 0;let s=n(p.openingStock);db.purchases.filter(x=>x.status!=='cancelled').forEach(x=>x.items?.forEach(i=>{if(i.productId===p.id)s+=n(i.qty)}));db.sales.filter(x=>x.status!=='cancelled').forEach(x=>x.items?.forEach(i=>{if(i.productId===p.id)s-=n(i.qty)}));db.stockMoves.filter(x=>x.type==='saleReturn').forEach(x=>{if(x.productId===p.id)s+=n(x.qty)});db.stockMoves.filter(x=>x.type==='purchaseReturn').forEach(x=>{if(x.productId===p.id)s-=n(x.qty)});db.stockMoves.filter(x=>x.type==='adjust').forEach(x=>{if(x.productId===p.id)s+=n(x.qty)});return Math.max(0,s)}
function bal(id){let v=n(party(id)?.openingBalance);db.sales.forEach(x=>{if(x.partyId===id)v+=n(x.due)*(x.type==='return'?-1:1)});db.purchases.forEach(x=>{if(x.partyId===id)v-=n(x.due)*(x.type==='return'?-1:1)});db.payments.forEach(x=>{if(x.partyId===id)v+=(x.direction==='in'?-n(x.amount):n(x.amount))});return v}
function cash(){let v=n(db.business?.openingCash);db.cashTx.forEach(x=>v+=n(x.amount)*(x.direction==='out'?-1:1));return v}function bank(){let v=n(db.business?.openingBank);db.bankTx.forEach(x=>v+=n(x.amount)*(x.direction==='out'?-1:1));return v}
function cogs(s){return (s.items||[]).reduce((a,i)=>a+n(i.qty)*n(product(i.productId)?.purchasePrice),0)}function totals(){let sales=db.sales.filter(x=>x.status!=='cancelled'&&x.type!=='return').reduce((a,x)=>a+n(x.total),0),sr=db.sales.filter(x=>x.type==='return').reduce((a,x)=>a+n(x.total),0),pur=db.purchases.filter(x=>x.status!=='cancelled'&&x.type!=='return').reduce((a,x)=>a+n(x.total),0),pr=db.purchases.filter(x=>x.type==='return').reduce((a,x)=>a+n(x.total),0),exp=db.expenses.reduce((a,x)=>a+n(x.amount),0),rece=db.parties.filter(x=>x.type!=='supplier').reduce((a,x)=>a+Math.max(0,bal(x.id)),0),pay=db.parties.filter(x=>x.type!=='customer').reduce((a,x)=>a+Math.max(0,-bal(x.id)),0),cg=db.sales.filter(x=>x.status!=='cancelled'&&x.type!=='return').reduce((a,x)=>a+cogs(x),0),gross=sales-sr-cg;return{sales,sr,pur,pr,exp,rece,pay,cg,gross,net:gross-exp,cash:cash(),bank:bank()}}
function top(title='হিসাববাটি'){return `<header class="top"><button class="ib" onclick="drawer()">☰</button><div class="brand">${esc(title)} <small>• Business Accounting</small></div><div class="sp"></div><button class="ib" onclick="searchAll()">⌕</button><button class="ib" onclick="notifications()">🔔</button></header>`}
function bottom(){return `<nav class="bottom"><button class="pill buy" onclick="quick('purchase')">🛍️ কিনুন</button><button class="fab" onclick="quickSheet()">+</button><button class="pill sell" onclick="quick('sale')">💰 বিক্রি</button></nav>`}
function render(){if(!db.session){auth();return}dashboard()}
function dashboard(){let t=totals(),low=db.products.filter(p=>stock(p)<=n(p.minimumStock));document.getElementById('app').innerHTML=top()+`<main class="main"><section class="grid"><div class="balance"><div class="balance-title">মোট হাতে ও ব্যাংকে আছে <button class="ib" onclick="mask()">◉</button></div><div class="big" id="bigbal">${db.settings.mask?'••••••':money(t.cash+t.bank)}</div><div class="cashrow"><div><div class="label">🟢 নগদ</div><div class="value">${money(t.cash)}</div></div><div><div class="label">🔵 ব্যাংক</div><div class="value">${money(t.bank)}</div></div></div></div>${stat('🔴','মোট পাওনা',money(t.rece),'r','parties')}${stat('🔵','মোট দেনা',money(t.pay),'b','parties')}${stat('🟢','আজকের বিক্রি',money(daySales()),'g','sales')}${stat('🟡','আজকের ক্রয়',money(dayPurchase()),'o','purchases')}<div class="card wide" onclick="openPage('expenses')"><div class="dot r">💸</div><div><h3 style="margin:0">মোট খরচ</h3><strong>${money(t.exp)}</strong></div><div class="sp">›</div></div></section><div class="sectiontitle">আজকের হিসাব</div><div class="kpis"><div class="kpi"><small>বিক্রি</small><strong>${money(daySales())}</strong></div><div class="kpi"><small>ক্রয়</small><strong>${money(dayPurchase())}</strong></div><div class="kpi"><small>খরচ</small><strong>${money(dayExpense())}</strong></div><div class="kpi"><small>লাভ</small><strong>${money(dayProfit())}</strong></div></div><div class="sectiontitle">সাম্প্রতিক বিক্রি</div><div class="card"><div class="tablewrap"><table><thead><tr><th>ইনভয়েস</th><th>কাস্টমার</th><th>মোট</th><th>পরিশোধ</th><th>বাকি</th></tr></thead><tbody>${db.sales.slice().reverse().slice(0,8).map(s=>`<tr><td>${esc(s.invoice)}</td><td>${esc(party(s.partyId)?.name||'নগদ')}</td><td>${money(s.total)}</td><td>${money(s.paid)}</td><td>${money(s.due)}</td></tr>`).join('')||empty(5,'কোনো বিক্রি নেই')}</tbody></table></div></div><div class="sectiontitle">কম স্টক</div><div class="card"><div class="tablewrap"><table><thead><tr><th>পণ্য</th><th>স্টক</th><th>ন্যূনতম</th></tr></thead><tbody>${low.map(p=>`<tr><td>${esc(p.name)}</td><td>${stock(p)}</td><td>${n(p.minimumStock)}</td></tr>`).join('')||empty(3,'কম স্টকের পণ্য নেই')}</tbody></table></div></div></main>${bottom()}`}
function stat(i,t,v,c,p){return `<div class="card stat" onclick="openPage('${p}')"><div class="dot ${c}">${i}</div><h3>${t}</h3><strong>${v}</strong> <span style="color:var(--p)">→</span></div>`}function empty(c,t){return `<tr><td colspan="${c}" class="empty">${t}</td></tr>`}function dayFilter(x){return x.date?.slice(0,10)===today()}function daySales(){return db.sales.filter(x=>x.status!=='cancelled'&&x.type!=='return'&&dayFilter(x)).reduce((a,x)=>a+n(x.total),0)}function dayPurchase(){return db.purchases.filter(x=>x.status!=='cancelled'&&x.type!=='return'&&dayFilter(x)).reduce((a,x)=>a+n(x.total),0)}function dayExpense(){return db.expenses.filter(dayFilter).reduce((a,x)=>a+n(x.amount),0)}function dayProfit(){return db.sales.filter(x=>x.status!=='cancelled'&&x.type!=='return'&&dayFilter(x)).reduce((a,x)=>a+n(x.total)-cogs(x),0)-dayExpense()}
function drawer(){document.getElementById('layers').innerHTML=`<div class="drawer-bg" onclick="closeLayers()"></div><aside class="drawer open"><div class="dhead"><div class="profile"><div class="avatar">👤</div><div><div class="pname">${esc(db.business?.owner||'ব্যবসার মালিক')}</div><div class="pemail">${esc(db.business?.email||'')}</div></div></div><div style="margin-top:12px;font-weight:800">${esc(db.business?.name||'আমার ব্যবসা')}</div></div><div class="menu">${[['🏠','ড্যাশবোর্ড','dashboard'],['💰','বিক্রয় / POS','sales'],['🛍️','ক্রয়','purchases'],['📦','পণ্য ও ইনভেন্টরি','products'],['👥','কাস্টমার / পার্টি','parties'],['🏭','সরবরাহকারী','suppliers'],['🧾','অর্ডার','orders'],['💸','ব্যয় / খরচ','expenses'],['💵','ক্যাশ ও ব্যাংক','cash'],['📊','রিপোর্ট','reports'],['⚙️','সেটিংস','settings'],['🔐','PIN / নিরাপত্তা','security']].map(x=>`<button class="mi" onclick="closeLayers();openPage('${x[2]}')"><span class="micon">${x[0]}</span>${x[1]}</button>`).join('')}</div><div class="dfoot"><b>প্যাকেজ: ${esc(db.plan)}</b><button class="btn primary" style="width:100%;margin-top:9px" onclick="closeLayers();plans()">প্যাকেজ দেখুন</button><button class="btn danger" style="width:100%;margin-top:8px" onclick="logout()">লগআউট</button></div></aside>`}

function openPage(p){if(p==='dashboard')return dashboard();let map={sales:['বিক্রয় / POS',salesPage],purchases:['ক্রয়',purchasePage],products:['পণ্য ও ইনভেন্টরি',productsPage],parties:['কাস্টমার / পার্টি',partiesPage],suppliers:['সরবরাহকারী',supplierPage],orders:['অর্ডার',ordersPage],expenses:['ব্যয় / খরচ',expensesPage],cash:['ক্যাশ ও ব্যাংক',cashPage],reports:['রিপোর্ট',reportsPage],settings:['সেটিংস',settingsPage],security:['নিরাপত্তা',securityPage]};if(!map[p])return;document.getElementById('app').innerHTML=top()+`<main class="main"><div class="pagehead"><button class="ib" onclick="dashboard()">‹</button>${map[p][0]}</div>${map[p][1]()}</main>${bottom()}`}
function listPage(type){let sale=type==='sales',arr=db[type].slice().reverse();return `<div class="card"><div class="actions"><div class="search"><input id="ls" placeholder="ইনভয়েস / পার্টি খুঁজুন" oninput="filterList()"><span>⌕</span></div><button class="btn primary" onclick="${sale?'quick(\'sale\')':'quick(\'purchase\')'}">+ ${sale?'নতুন বিক্রয়':'নতুন ক্রয়'}</button></div><div class="tablewrap"><table id="lt"><thead><tr><th>নম্বর</th><th>তারিখ</th><th>পার্টি</th><th>মোট</th><th>পরিশোধ</th><th>বাকি</th><th>স্ট্যাটাস</th><th>অ্যাকশন</th></tr></thead><tbody>${arr.map(x=>`<tr><td>${esc(x.invoice)}</td><td>${esc(x.date?.slice(0,10))}</td><td>${esc(party(x.partyId)?.name||'নগদ')}</td><td>${money(x.total)}</td><td>${money(x.paid)}</td><td>${money(x.due)}</td><td><span class="badge ${x.type==='return'?'r':x.due?'o':'g'}">${x.type==='return'?'রিটার্ন':x.due?'বাকি':'পরিশোধিত'}</span></td><td><button class="btn secondary" onclick="showInvoice('${x.id}','${sale?'sale':'purchase'}')">ইনভয়েস</button></td></tr>`).join('')||empty(8,'কোনো লেনদেন নেই')}</tbody></table></div></div>`}function filterList(){let q=(document.getElementById('ls')?.value||'').toLowerCase();document.querySelectorAll('#lt tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}function salesPage(){return listPage('sales')}function purchasePage(){return listPage('purchases')}
let txItems=[];function quick(t){if(t==='sale'||t==='saleReturn')return transaction('sale',t==='saleReturn');if(t==='purchase'||t==='purchaseReturn')return transaction('purchase',t==='purchaseReturn');if(t==='receive'||t==='pay')return paymentForm(t==='receive'?'in':'out');if(t==='expense')return expenseForm();if(t==='reconcile')return reconcileForm();if(t==='bank')return bankForm();if(t==='saleOrder'||t==='purchaseOrder')return orderForm(t)}
function transaction(kind,isReturn=false){txItems=[];openModal(isReturn?(kind==='sale'?'বিক্রয় রিটার্ন':'ক্রয় রিটার্ন'):(kind==='sale'?'নতুন বিক্রয় / POS':'নতুন ক্রয়'),`<div class="formgrid"><div class="field"><label>${kind==='sale'?'কাস্টমার':'সরবরাহকারী'}</label><select id="txParty"><option value="">${kind==='sale'?'নগদ':'পার্টি নির্বাচন করুন'}</option>${db.parties.filter(p=>kind==='sale'?p.type!=='supplier':p.type!=='customer').map(p=>`<option value="${p.id}">${esc(p.name)} • ${esc(p.mobile||'')}</option>`).join('')}</select></div><div class="field"><label>তারিখ</label><input id="txDate" type="date" value="${today()}"></div><div class="field"><label>ইনভয়েস</label><input id="txInvoice" value="${(kind==='sale'?'SAL':'PUR')}-${Date.now().toString().slice(-8)}"></div><div class="field"><label>ডেলিভারি চার্জ</label><input id="txDelivery" type="number" min="0" value="0" oninput="calcTx()"></div></div><h3>পণ্য</h3><div id="txItems"></div><button class="btn secondary" onclick="addTxItem()">+ পণ্য যোগ করুন</button><div class="formgrid" style="margin-top:10px"><div class="field"><label>ডিসকাউন্ট</label><input id="txDiscount" type="number" min="0" value="0" oninput="calcTx()"></div><div class="field"><label>ট্যাক্স %</label><input id="txTax" type="number" min="0" value="${n(db.settings.tax)}" oninput="calcTx()"></div><div class="field"><label>পরিশোধ</label><input id="txPaid" type="number" min="0" value="0" oninput="calcTx()"></div><div class="field"><label>নোট</label><input id="txNote"></div></div><h3>পেমেন্ট</h3><div class="payments" id="payRows"></div><button class="btn secondary" style="margin-top:7px" onclick="addPayRow()">+ পেমেন্ট যোগ</button><div class="kpis" style="margin-top:12px"><div class="kpi"><small>Subtotal</small><strong id="txSub">৳ 0.00</strong></div><div class="kpi"><small>Grand Total</small><strong id="txGrand">৳ 0.00</strong></div><div class="kpi"><small>Paid</small><strong id="txP">৳ 0.00</strong></div><div class="kpi"><small>Due</small><strong id="txDue">৳ 0.00</strong></div></div>`,`<button class="btn secondary" onclick="closeLayers()">বাতিল</button><button class="btn primary" onclick="saveTx('${kind}',${isReturn})">সেভ করুন ও ইনভয়েস</button>`);addTxItem();addPayRow();calcTx()}
function addTxItem(){let w=document.getElementById('txItems');let d=document.createElement('div');d.className='txrow';d.innerHTML=`<div class="formgrid"><div class="field"><label>পণ্য</label><select class="tp" onchange="productChanged(this)"><option value="">পণ্য নির্বাচন</option>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} • স্টক ${stock(p)}</option>`).join('')}</select></div><div class="field"><label>পরিমাণ</label><input class="tq" type="number" min="0.01" step="0.01" value="1" oninput="calcTx()"></div><div class="field"><label>একক মূল্য</label><input class="tpr" type="number" min="0" step="0.01" value="0" oninput="calcTx()"></div><div class="field"><label>লাইন মোট</label><input class="tl" readonly value="0"><button class="btn danger" onclick="this.closest('.txrow').remove();calcTx()">বাদ দিন</button></div></div>`;w.appendChild(d)}function productChanged(s){let p=product(s.value);if(p)s.closest('.txrow').querySelector('.tpr').value=p.sellingPrice;calcTx()}function addPayRow(){let w=document.getElementById('payRows'),d=document.createElement('div');d.className='payrow';d.innerHTML=`<select><option>Cash</option><option>Cheque</option><option>bKash</option><option>Nagad</option><option>Rocket</option><option>Bank</option></select><input type="number" min="0" step="0.01" value="0" oninput="calcTx()"><button class="btn secondary" onclick="this.parentElement.remove();calcTx()">×</button>`;w.appendChild(d)}function calcTx(){let sub=0;document.querySelectorAll('.txrow').forEach(r=>{let v=n(r.querySelector('.tq')?.value)*n(r.querySelector('.tpr')?.value);sub+=v;if(r.querySelector('.tl'))r.querySelector('.tl').value=v.toFixed(2)});let d=n(document.getElementById('txDiscount')?.value),tax=n(document.getElementById('txTax')?.value),del=n(document.getElementById('txDelivery')?.value),g=Math.max(0,sub-d+(sub-d)*tax/100+del),paid=[...document.querySelectorAll('.payrow input')].reduce((a,x)=>a+n(x.value),0);document.getElementById('txPaid').value=paid.toFixed(2);for(let id of ['txSub','txGrand','txP','txDue'])if(document.getElementById(id))document.getElementById(id).textContent=money(id==='txSub'?sub:id==='txGrand'?g:id==='txP'?paid:Math.max(0,g-paid));return{sub,d,tax,del,g,paid,due:Math.max(0,g-paid)}}
function saveTx(kind,isReturn){let c=calcTx(),items=[];for(let r of document.querySelectorAll('.txrow')){let pid=r.querySelector('.tp')?.value,q=n(r.querySelector('.tq')?.value),price=n(r.querySelector('.tpr')?.value);if(!pid||q<=0)return toast('পণ্য ও সঠিক পরিমাণ দিন');if(kind==='sale'&&!isReturn&&stock(product(pid))<q)return toast(product(pid).name+' এর পর্যাপ্ত স্টক নেই');items.push({productId:pid,qty:q,price})}if(!items.length)return toast('কমপক্ষে একটি পণ্য দিন');if(c.paid>c.g+.005)return toast('পরিশোধ মোটের বেশি হতে পারবে না');let x={id:uid(kind==='sale'?'SAL':'PUR'),invoice:document.getElementById('txInvoice').value,date:document.getElementById('txDate').value,partyId:document.getElementById('txParty').value||null,items,subtotal:c.sub,discount:c.d,tax:c.tax,delivery:c.del,total:c.g,paid:c.paid,due:c.due,type:isReturn?'return':'normal',status:'completed',note:document.getElementById('txNote').value,createdAt:now()};(kind==='sale'?db.sales:db.purchases).push(x);items.forEach(i=>db.stockMoves.push({id:uid('SM'),productId:i.productId,qty:isReturn?(kind==='sale'?i.qty:-i.qty):(kind==='sale'?-i.qty:i.qty),type:isReturn?(kind==='sale'?'saleReturn':'purchaseReturn'):kind,ref:x.id,createdAt:now()}));let rows=[...document.querySelectorAll('.payrow')];rows.forEach(r=>{let amt=n(r.querySelector('input').value);if(amt)db.cashTx.push({id:uid('CTX'),amount:amt,direction:kind==='sale'?'in':'out',method:r.querySelector('select').value,ref:x.id,createdAt:now()})});audit(kind,isReturn?'return':'create',x.id);save();closeLayers();showInvoice(x.id,kind);}
function showInvoice(id,kind){let x=(kind==='sale'?db.sales:db.purchases).find(a=>a.id===id),b=db.business||{},p=party(x.partyId);document.getElementById('app').innerHTML=top()+`<main class="main"><div class="pagehead"><button class="ib" onclick="openPage('${kind==='sale'?'sales':'purchases'}')">‹</button>ইনভয়েস</div><div class="actions no-print" style="justify-content:flex-end;margin-bottom:10px"><button class="btn primary" onclick="window.print()">🖨️ প্রিন্ট / PDF</button><button class="btn secondary" onclick="shareInv('${id}','${kind}')">শেয়ার</button></div><section class="invoice"><div class="invoicehead"><div><div class="invtitle">${esc(b.name||'হিসাববাটি')}</div><div>${esc(b.address||'')}</div><div>${esc(b.mobile||'')}</div></div><div class="right"><b>${kind==='sale'?'বিক্রয় ইনভয়েস':'ক্রয় ইনভয়েস'}</b><br>নং: ${esc(x.invoice)}<br>তারিখ: ${esc(x.date)}</div></div><div style="padding:12px 0"><b>${kind==='sale'?'কাস্টমার':'সরবরাহকারী'}:</b> ${esc(p?.name||'নগদ')} ${p?.mobile?'• '+esc(p.mobile):''}</div><div class="tablewrap"><table><thead><tr><th>ক্রম</th><th>পণ্য</th><th>পরিমাণ</th><th>দর</th><th>মোট</th></tr></thead><tbody>${x.items.map((i,k)=>`<tr><td>${k+1}</td><td>${esc(product(i.productId)?.name||'')}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`).join('')}</tbody></table></div><div class="right" style="margin-top:12px"><div>Subtotal: ${money(x.subtotal)}</div><div>Discount: ${money(x.discount)}</div><div>Tax: ${x.tax}%</div><div>Delivery: ${money(x.delivery)}</div><div class="totalbig">Grand Total: ${money(x.total)}</div><div>Paid: ${money(x.paid)}</div><div>Due: ${money(x.due)}</div></div><hr><b>কথায়:</b> ${words(x.total)}<p style="text-align:center">${esc(b.footer||'ধন্যবাদ।')}</p></section></main>`}

function words(v){let a=['','এক','দুই','তিন','চার','পাঁচ','ছয়','সাত','আট','নয়','দশ','এগারো','বারো','তেরো','চৌদ্দ','পনেরো','ষোল','সতেরো','আঠারো','উনিশ'],t=['','','বিশ','ত্রিশ','চল্লিশ','পঞ্চাশ','ষাট','সত্তর','আশি','নব্বই'];function u(x){return x<20?a[x]:x%10===0?t[x/10]:t[Math.floor(x/10)]+a[x%10]}function b(x){if(x<100)return u(x);if(x<1000)return u(Math.floor(x/100))+' শত'+(x%100?' '+u(x%100):'');if(x<100000)return u(Math.floor(x/1000))+' হাজার'+(x%1000?' '+b(x%1000):'');if(x<10000000)return u(Math.floor(x/100000))+' লক্ষ'+(x%100000?' '+b(x%100000):'');return b(Math.floor(x/10000000))+' কোটি'+(x%10000000?' '+b(x%10000000):'')}return b(Math.floor(n(v)))+' টাকা মাত্র'}
function productsPage(){return `<div class="card"><div class="actions"><div class="search"><input id="ps" placeholder="পণ্য / SKU / বারকোড" oninput="filterP()"><span>⌕</span></div><button class="btn primary" onclick="productForm()">+ পণ্য যোগ</button></div><div class="tablewrap"><table id="pt"><thead><tr><th>পণ্য</th><th>SKU</th><th>ক্রয়</th><th>বিক্রয়</th><th>স্টক</th><th>স্ট্যাটাস</th><th>অ্যাকশন</th></tr></thead><tbody>${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku)}</td><td>${money(p.purchasePrice)}</td><td>${money(p.sellingPrice)}</td><td>${stock(p)} ${esc(p.unit||'pcs')}</td><td><span class="badge ${stock(p)<=0?'r':stock(p)<=n(p.minimumStock)?'o':'g'}">${stock(p)<=0?'স্টক শেষ':stock(p)<=n(p.minimumStock)?'কম স্টক':'স্টক আছে'}</span></td><td><button class="btn secondary" onclick="productForm('${p.id}')">এডিট</button></td></tr>`).join('')||empty(7,'কোনো পণ্য নেই')}</tbody></table></div></div><div class="card"><h3>স্টক মুভমেন্ট</h3><div class="tablewrap"><table><thead><tr><th>তারিখ</th><th>পণ্য</th><th>ধরন</th><th>পরিমাণ</th></tr></thead><tbody>${db.stockMoves.slice().reverse().slice(0,50).map(x=>`<tr><td>${x.createdAt.slice(0,10)}</td><td>${esc(product(x.productId)?.name)}</td><td>${x.type}</td><td>${x.qty}</td></tr>`).join('')||empty(4,'স্টক মুভমেন্ট নেই')}</tbody></table></div></div>`}function filterP(){let q=(document.getElementById('ps')?.value||'').toLowerCase();document.querySelectorAll('#pt tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function productForm(id=''){let p=product(id)||{name:'',category:'',sku:'',barcode:'',unit:'pcs',purchasePrice:0,sellingPrice:0,wholesalePrice:0,openingStock:0,minimumStock:0};openModal(id?'পণ্য সম্পাদনা':'নতুন পণ্য',`<form id="pf"><div class="formgrid">${fld('name','পণ্যের নাম',p.name)}${fld('category','ক্যাটাগরি',p.category)}${fld('sku','SKU',p.sku)}${fld('barcode','বারকোড',p.barcode)}${fld('unit','ইউনিট',p.unit)}${fld('purchasePrice','ক্রয় মূল্য',p.purchasePrice,'number')}${fld('sellingPrice','বিক্রয় মূল্য',p.sellingPrice,'number')}${fld('wholesalePrice','হোলসেল মূল্য',p.wholesalePrice,'number')}${fld('openingStock','ওপেনিং স্টক',p.openingStock,'number')}${fld('minimumStock','ন্যূনতম স্টক',p.minimumStock,'number')}<div class="field full"><label>বিবরণ</label><textarea name="description">${esc(p.description||'')}</textarea></div></div></form>`,`<button class="btn secondary" onclick="closeLayers()">বাতিল</button><button class="btn primary" onclick="saveProduct('${id}')">সেভ</button>`)}function saveProduct(id){let v=Object.fromEntries(new FormData(document.getElementById('pf')));['purchasePrice','sellingPrice','wholesalePrice','openingStock','minimumStock'].forEach(k=>v[k]=n(v[k]));if(!v.name)return toast('পণ্যের নাম দিন');if(id)Object.assign(product(id),v);else{let x={id:uid('PROD'),...v,createdAt:now()};db.products.push(x);db.stockMoves.push({id:uid('SM'),productId:x.id,qty:x.openingStock,type:'opening',ref:x.id,createdAt:now()})}audit(id?'product_update':'product_create',id||v.name);save();closeLayers();openPage('products');toast('পণ্য সংরক্ষণ হয়েছে')}
function partiesPage(){return partyPageBy('customer')}function supplierPage(){return partyPageBy('supplier')}function partyPageBy(type){let arr=db.parties.filter(p=>type==='customer'?p.type!=='supplier':p.type!=='customer');return `<div class="card"><div class="actions"><button class="btn primary" onclick="partyForm('${type}')">+ ${type==='customer'?'কাস্টমার':'সরবরাহকারী'} যোগ</button></div><div class="tablewrap"><table><thead><tr><th>নাম</th><th>মোবাইল</th><th>ধরন</th><th>ওপেনিং</th><th>ব্যালেন্স</th><th>অ্যাকশন</th></tr></thead><tbody>${arr.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.mobile)}</td><td>${p.type}</td><td>${money(p.openingBalance)}</td><td>${money(Math.abs(bal(p.id)))}</td><td>${type==='customer'?`<button class="btn green" onclick="paymentForm('in','${p.id}')">বাকি আদায়</button>`:`<button class="btn danger" onclick="paymentForm('out','${p.id}')">বাকি পরিশোধ</button>`} <button class="btn secondary" onclick="ledger('${p.id}')">লেজার</button></td></tr>`).join('')||empty(6,'কোনো পার্টি নেই')}</tbody></table></div></div>`}
function partyForm(type){openModal(type==='customer'?'নতুন কাস্টমার':'নতুন সরবরাহকারী',`<form id="partyf"><div class="formgrid">${fld('name','নাম *')}${fld('mobile','মোবাইল')}${fld('address','ঠিকানা')}${fld('type','ধরন',type,'select',['customer','supplier','both'])}${fld('openingBalance','ওপেনিং ব্যালেন্স',0,'number')}<div class="field full"><label>নোট</label><textarea name="notes"></textarea></div></div></form>`,`<button class="btn secondary" onclick="closeLayers()">বাতিল</button><button class="btn primary" onclick="saveParty()">সেভ</button>`)}function saveParty(){let v=Object.fromEntries(new FormData(document.getElementById('partyf')));v.openingBalance=n(v.openingBalance);if(!v.name)return toast('নাম দিন');db.parties.push({id:uid('PTY'),...v,createdAt:now()});audit('party_create',v.name);save();closeLayers();openPage('parties');toast('পার্টি সংরক্ষণ হয়েছে')}
function ledger(id){let p=party(id),tx=[];db.sales.filter(x=>x.partyId===id).forEach(x=>tx.push({date:x.date,desc:'বিক্রয়',debit:x.total,credit:x.paid}));db.purchases.filter(x=>x.partyId===id).forEach(x=>tx.push({date:x.date,desc:'ক্রয়',debit:x.paid,credit:x.total}));db.payments.filter(x=>x.partyId===id).forEach(x=>tx.push({date:x.date,desc:x.direction==='in'?'বাকি আদায়':'বাকি পরিশোধ',debit:x.direction==='out'?x.amount:0,credit:x.direction==='in'?x.amount:0}));let b=n(p.openingBalance);tx.sort((a,z)=>a.date.localeCompare(z.date));openModal(`${esc(p.name)} — লেজার`,`<p>বর্তমান ব্যালেন্স: <b>${money(Math.abs(bal(id)))}</b></p><div class="tablewrap"><table><thead><tr><th>তারিখ</th><th>বিবরণ</th><th>Debit</th><th>Credit</th><th>Balance</th></tr></thead><tbody>${tx.map(x=>{b+=n(x.debit)-n(x.credit);return `<tr><td>${x.date}</td><td>${x.desc}</td><td>${money(x.debit)}</td><td>${money(x.credit)}</td><td>${money(Math.abs(b))}</td></tr>`}).join('')||empty(5,'লেনদেন নেই')}</tbody></table></div>`,'')}
function expensesPage(){return `<div class="kpis"><div class="kpi"><small>মোট খরচ</small><strong>${money(totals().exp)}</strong></div><div class="kpi"><small>ক্যাটাগরি</small><strong>${new Set(db.expenses.map(x=>x.category)).size}</strong></div></div><div class="card"><button class="btn primary" onclick="expenseForm()">+ খরচ যোগ</button><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>তারিখ</th><th>ক্যাটাগরি</th><th>পরিমাণ</th><th>পেমেন্ট</th><th>নোট</th></tr></thead><tbody>${db.expenses.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${esc(x.method)}</td><td>${esc(x.note)}</td></tr>`).join('')||empty(5,'কোনো খরচ নেই')}</tbody></table></div></div>`}function expenseForm(){openModal('নতুন খরচ',`<form id="ef"><div class="formgrid">${fld('category','ক্যাটাগরি','দোকান ভাড়া')}${fld('amount','পরিমাণ',0,'number')}${fld('date','তারিখ',today(),'date')}${fld('method','পেমেন্ট','Cash','select',['Cash','Bank','bKash','Nagad','Rocket'])}${fld('note','নোট')}</div></form>`,`<button class="btn secondary" onclick="closeLayers()">বাতিল</button><button class="btn primary" onclick="saveExpense()">সেভ</button>`)}function saveExpense(){let v=Object.fromEntries(new FormData(document.getElementById('ef')));v.amount=n(v.amount);if(v.amount<=0)return toast('সঠিক পরিমাণ দিন');db.expenses.push({id:uid('EXP'),...v,createdAt:now()});if(v.method==='Cash')db.cashTx.push({id:uid('CTX'),amount:v.amount,direction:'out',method:'Cash',ref:v.id,createdAt:now()});if(v.method==='Bank')db.bankTx.push({id:uid('BTX'),amount:v.amount,direction:'out',ref:v.id,createdAt:now()});audit('expense_create',v.id);save();closeLayers();openPage('expenses');toast('খরচ সংরক্ষণ হয়েছে')}
function paymentForm(direction,id=''){let incoming=direction==='in',p=id?party(id):null;openModal(incoming?'বাকি আদায়':'বাকি পরিশোধ',`<form id="payf"><div class="formgrid">${fld('partyId','পার্টি',id,'select',db.parties.map(x=>({value:x.id,label:x.name}))) }${fld('amount','পরিমাণ',0,'number')}${fld('method','পেমেন্ট','Cash','select',['Cash','Bank','bKash','Nagad','Rocket','Cheque'])}${fld('date','তারিখ',today(),'date')}${fld('note','নোট')}</div>${p?`<div class="notice">বর্তমান ব্যালেন্স: ${money(Math.abs(bal(p.id)))}</div>`:''}</form>`,`<button class="btn secondary" onclick="closeLayers()">বাতিল</button><button class="btn primary" onclick="savePayment('${direction}')">সেভ</button>`)}function savePayment(direction){let v=Object.fromEntries(new FormData(document.getElementById('payf')));v.amount=n(v.amount);if(!v.partyId||v.amount<=0)return toast('পার্টি ও পরিমাণ দিন');let x={id:uid('PAY'),...v,direction,createdAt:now()};db.payments.push(x);if(v.method==='Cash')db.cashTx.push({id:uid('CTX'),amount:v.amount,direction,method:'Cash',ref:x.id,createdAt:now()});if(v.method==='Bank')db.bankTx.push({id:uid('BTX'),amount:v.amount,direction,ref:x.id,createdAt:now()});audit('party_payment',x.id);save();closeLayers();dashboard();toast('পেমেন্ট সংরক্ষণ হয়েছে')}
function cashPage(){return `<div class="kpis"><div class="kpi"><small>বর্তমান ক্যাশ</small><strong>${money(cash())}</strong></div><div class="kpi"><small>ব্যাংক</small><strong>${money(bank())}</strong></div></div><div class="card"><div class="actions"><button class="btn primary" onclick="reconcileForm()">ক্যাশ মিলাই</button><button class="btn secondary" onclick="bankForm()">ব্যাংক অ্যাকাউন্ট</button><button class="btn secondary" onclick="moneyForm()">নগদ/ব্যাংক লেনদেন</button></div><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>তারিখ</th><th>অ্যাকাউন্ট</th><th>দিক</th><th>পরিমাণ</th><th>রেফারেন্স</th></tr></thead><tbody>${[...db.cashTx.map(x=>({...x,account:'Cash'})),...db.bankTx.map(x=>({...x,account:'Bank'}))].reverse().slice(0,100).map(x=>`<tr><td>${x.createdAt?.slice(0,10)||x.date}</td><td>${x.account}</td><td>${x.direction==='in'?'প্রাপ্তি':'প্রদান'}</td><td>${money(x.amount)}</td><td>${esc(x.ref||'')}</td></tr>`).join('')||empty(5,'কোনো লেনদেন নেই')}</tbody></table></div></div>`}function reconcileForm(){openModal('ক্যাশ মিলাই',`<form id="rf"><p>System Cash: <b>${money(cash())}</b></p><div class="formgrid">${fld('actual','Actual Cash',cash(),'number')}${fld('reason','কারণ')}</div></form>`,`<button class="btn secondary" onclick="closeLayers()">বাতিল</button><button class="btn primary" onclick="saveReconcile()">Adjustment</button>`)}function saveReconcile(){let v=Object.fromEntries(new FormData(document.getElementById('rf'))),d=n(v.actual)-cash();if(!d)return toast('কোনো পার্থক্য নেই');db.cashTx.push({id:uid('CTX'),amount:Math.abs(d),direction:d>0?'in':'out',method:'Cash',ref:'adjustment',reason:v.reason,createdAt:now()});audit('cash_adjustment','',v.reason);save();closeLayers();openPage('cash')}
function bankForm(){openModal('ব্যাংক অ্যাকাউন্ট',`<form id="bf"><div class="formgrid">${fld('name','ব্যাংকের নাম')}${fld('accountName','অ্যাকাউন্ট নাম')}${fld('accountNumber','অ্যাকাউন্ট নম্বর')}${fld('openingBalance','ওপেনিং ব্যালেন্স',0,'number')}</div></form>`,`<button class="btn secondary" onclick="closeLayers()">বাতিল</button><button class="btn primary" onclick="saveBank()">সেভ</button>`)}function saveBank(){let v=Object.fromEntries(new FormData(document.getElementById('bf')));v.openingBalance=n(v.openingBalance);db.bankAccounts.push({id:uid('BANK'),...v});db.business=db.business||{};db.business.openingBank=n(db.business.openingBank)+v.openingBalance;save();closeLayers();openPage('cash')}
function moneyForm(){openModal('ক্যাশ / ব্যাংক লেনদেন',`<form id="mf"><div class="formgrid">${fld('account','অ্যাকাউন্ট','cash','select',['cash','bank'])}${fld('direction','ধরন','in','select',['in','out'])}${fld('amount','পরিমাণ',0,'number')}${fld('note','নোট')}</div></form>`,`<button class="btn secondary" onclick="closeLayers()">বাতিল</button><button class="btn primary" onclick="saveMoney()">সেভ</button>`)}function saveMoney(){let v=Object.fromEntries(new FormData(document.getElementById('mf')));v.amount=n(v.amount);let x={id:uid('TX'),...v,createdAt:now()};if(v.account==='cash')db.cashTx.push(x);else db.bankTx.push(x);audit('money_transaction',x.id);save();closeLayers();openPage('cash')}
function orderForm(type){let sale=type==='saleOrder';openModal(sale?'বিক্রয় অর্ডার':'ক্রয় অর্ডার',`<form id="of"><div class="formgrid">${fld('partyId','পার্টি','','select',db.parties.map(x=>({value:x.id,label:x.name})))}${fld('date','তারিখ',today(),'date')}${fld('status','স্ট্যাটাস','draft','select',sale?['draft','confirmed','partially_delivered','completed','cancelled']:['draft','ordered','partially_received','received','completed','cancelled'])}${fld('total','মোট',0,'number')}</div>${fld('note','নোট')}</form>`,`<button class="btn secondary" onclick="closeLayers()">বাতিল</button><button class="btn primary" onclick="saveOrder('${type}')">সেভ</button>`)}function saveOrder(type){let v=Object.fromEntries(new FormData(document.getElementById('of')));v.total=n(v.total);db.orders.push({id:uid(type==='saleOrder'?'SO':'PO'),number:'ORD-'+Date.now().toString().slice(-8),type,...v,createdAt:now()});audit('order_create',v.number);save();closeLayers();openPage('orders')}
function ordersPage(){return `<div class="card"><div class="actions"><button class="btn primary" onclick="orderForm('saleOrder')">+ বিক্রয় অর্ডার</button><button class="btn secondary" onclick="orderForm('purchaseOrder')">+ ক্রয় অর্ডার</button></div><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>নম্বর</th><th>ধরন</th><th>পার্টি</th><th>তারিখ</th><th>স্ট্যাটাস</th><th>মোট</th></tr></thead><tbody>${db.orders.slice().reverse().map(x=>`<tr><td>${x.number}</td><td>${x.type}</td><td>${esc(party(x.partyId)?.name||'')}</td><td>${x.date}</td><td><span class="badge b">${x.status}</span></td><td>${money(x.total)}</td></tr>`).join('')||empty(6,'কোনো অর্ডার নেই')}</tbody></table></div></div>`}
function reportsPage(){return `<div class="card"><div class="formgrid"><div class="field"><label>শুরু</label><input id="rfm" type="date" value="${today()}"></div><div class="field"><label>শেষ</label><input id="rto" type="date" value="${today()}"></div></div><div class="actions" style="margin-top:10px"><button class="btn primary" onclick="reportRun()">রিপোর্ট তৈরি</button><button class="btn secondary" onclick="exportCSV()">CSV Export</button><button class="btn secondary" onclick="backup()">JSON Backup</button><button class="btn secondary" onclick="document.getElementById('restore').click()">Restore</button><input id="restore" hidden type="file" accept=".json" onchange="restore(event)"></div></div><div id="reportOut"></div>`}function reportRun(){let f=document.getElementById('rfm').value,t=document.getElementById('rto').value,ok=x=>x.date?.slice(0,10)>=f&&x.date?.slice(0,10)<=t,s=db.sales.filter(x=>ok(x)&&x.type!=='return'),p=db.purchases.filter(x=>ok(x)&&x.type!=='return'),e=db.expenses.filter(ok),gross=s.reduce((a,x)=>a+n(x.total)-cogs(x),0),ex=e.reduce((a,x)=>a+n(x.amount),0);document.getElementById('reportOut').innerHTML=`<div class="kpis"><div class="kpi"><small>বিক্রি</small><strong>${money(s.reduce((a,x)=>a+n(x.total),0))}</strong></div><div class="kpi"><small>ক্রয়</small><strong>${money(p.reduce((a,x)=>a+n(x.total),0))}</strong></div><div class="kpi"><small>Gross Profit</small><strong>${money(gross)}</strong></div><div class="kpi"><small>Net Profit</small><strong>${money(gross-ex)}</strong></div></div><div class="card" style="margin-top:10px"><h3>রিপোর্ট সারাংশ</h3><div class="setting-row">পাওনা <b>${money(totals().rece)}</b></div><div class="setting-row">দেনা <b>${money(totals().pay)}</b></div><div class="setting-row">স্টক ভ্যালু <b>${money(db.products.reduce((a,p)=>a+stock(p)*n(p.purchasePrice),0))}</b></div><div class="setting-row">ক্যাশ <b>${money(cash())}</b></div><div class="setting-row">ব্যাংক <b>${money(bank())}</b></div></div>`}function exportCSV(){let rows=[['Invoice','Date','Party','Total','Paid','Due','Status'],...db.sales.map(x=>[x.invoice,x.date,party(x.partyId)?.name||'Walk-in',x.total,x.paid,x.due,x.status])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');download('sales-report.csv',csv,'text/csv')}function backup(){download('hisabbati-backup.json',JSON.stringify(db,null,2),'application/json')}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=merge(JSON.parse(r.result));save();toast('Backup restore হয়েছে');render()}catch{toast('Backup ফাইল সঠিক নয়')}};r.readAsText(f)}function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function settingsPage(){return `<div class="card"><h3>ব্যবসার প্রোফাইল</h3><div class="actions"><b>${esc(db.business?.name||'')}</b><span>${esc(db.business?.mobile||'')}</span></div><button class="btn primary" style="margin-top:10px" onclick="businessForm()">প্রোফাইল সম্পাদনা</button></div><div class="card"><h3>ইনভয়েস ও হিসাব</h3><div class="actions"><button class="btn secondary" onclick="settingsForm()">সেটিংস</button><button class="btn secondary" onclick="plans()">Subscription</button></div></div><div class="card"><h3>পেমেন্ট মাধ্যম</h3>${['cash','bank','bKash','nagad','rocket','cheque'].map(k=>`<div class="setting-row" style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><span>${k}</span><input type="checkbox" ${db.settings.paymentMethods?.[k]!==false?'checked':''} onchange="db.settings.paymentMethods['${k}']=this.checked;save()"></div>`).join('')}</div><div class="card"><h3>ডেটা</h3><div class="actions"><button class="btn secondary" onclick="backup()">Backup</button><button class="btn danger" onclick="resetAll()">সব ডেটা মুছুন</button></div></div>`}function businessForm(){let b=db.business||{};openModal('Business Profile',`<form id="bizf"><div class="formgrid">${fld('name','ব্যবসার নাম',b.name||'আমার ব্যবসা')}${fld('owner','মালিকের নাম',b.owner||'')}${fld('mobile','মোবাইল',b.mobile||'')}${fld('email','ইমেইল',b.email||'')}${fld('address','ঠিকানা',b.address||'')}${fld('currency','মুদ্রা','৳','select',['৳','USD'])}${fld('invoicePrefix','ইনভয়েস Prefix',b.invoicePrefix||'INV')}${fld('footer','ইনভয়েস Footer',b.footer||'ধন্যবাদ')}${fld('openingCash','ওপেনিং ক্যাশ',b.openingCash||0,'number')}${fld('openingBank','ওপেনিং ব্যাংক',b.openingBank||0,'number')}</div></form>`,`<button class="btn secondary" onclick="closeLayers()">বাতিল</button><button class="btn primary" onclick="saveBusiness()">সেভ</button>`)}function saveBusiness(){let v=Object.fromEntries(new FormData(document.getElementById('bizf')));v.openingCash=n(v.openingCash);v.openingBank=n(v.openingBank);db.business=v;db.settings.currency=v.currency||'৳';save();closeLayers();settingsPage();openPage('settings');toast('Business Profile সংরক্ষণ হয়েছে')}
function settingsForm(){openModal('হিসাব সেটিংস',`<form id="setf"><div class="formgrid">${fld('tax','ডিফল্ট ট্যাক্স %',db.settings.tax,'number')}${fld('delivery','ডিফল্ট ডেলিভারি',db.settings.delivery,'number')}</div></form>`,`<button class="btn secondary" onclick="closeLayers()">বাতিল</button><button class="btn primary" onclick="saveSettings()">সেভ</button>`)}function saveSettings(){let v=Object.fromEntries(new FormData(document.getElementById('setf')));db.settings.tax=n(v.tax);db.settings.delivery=n(v.delivery);save();closeLayers();openPage('settings')}
function securityPage(){return `<div class="card"><h3>PIN / নিরাপত্তা</h3><div class="notice">অ্যাকাউন্টের PIN অবশ্যই ঠিক <b>৬ ডিজিট</b>। নতুন অ্যাকাউন্টে OTP/Verification Code লাগবে না। PIN ভুলে গেলে ইমেইল reset link ব্যবহার করুন।</div><button class="btn primary" style="margin-top:10px" onclick="forgotFromSettings()">PIN reset link</button></div><div class="card"><h3>Audit Log</h3><div class="tablewrap"><table><thead><tr><th>তারিখ</th><th>Action</th><th>Reference</th></tr></thead><tbody>${db.audit.slice().reverse().slice(0,100).map(x=>`<tr><td>${x.createdAt}</td><td>${esc(x.action)}</td><td>${esc(x.ref)}</td></tr>`).join('')||empty(3,'Audit log নেই')}</tbody></table></div></div>`}function forgotFromSettings(){if(window.authForgot)window.authForgot();else toast('Authentication module loading')}
function plans(){openModal('Subscription / Plan',`<div class="grid">${planCard('Basic','ফ্রি',['বিক্রয়','ক্রয়','পণ্য','পার্টি','রিপোর্ট'])}${planCard('Business','৳ ৩৬৬ / মাস',['Detailed Reports','Thermal Printing','Bank','Orders','৫ Users','Offline Mode','Inventory'],true)}${planCard('Professional','৳ ৯৯৯ / মাস',['সব Business','Advanced Reports','Multi Device Sync','A4 + Thermal','Role Permission','Audit Log'])}</div>`,'')}function planCard(name,price,features,feature){return `<div class="plan ${feature?'feature':''}"><h3>${name}</h3><div class="price">${price}</div><ul>${features.map(x=>`<li>✓ ${x}</li>`).join('')}</ul><button class="btn ${feature?'primary':'secondary'}" style="width:100%" onclick="db.plan='${name}';save();closeLayers();toast('${name} প্যাকেজ নির্বাচন হয়েছে')">${db.plan===name?'বর্তমান':'নির্বাচন করুন'}</button></div>`}
function searchAll(){openModal('Global Search',`<div class="search"><input id="gq" autofocus placeholder="পণ্য, SKU, বারকোড, পার্টি, মোবাইল, ইনভয়েস" oninput="doGlobal()"><span>⌕</span></div><div id="gres" style="margin-top:8px"></div>`,'')}function doGlobal(){let q=(document.getElementById('gq')?.value||'').toLowerCase(),r=[];db.products.filter(x=>[x.name,x.sku,x.barcode].join(' ').toLowerCase().includes(q)).forEach(x=>r.push('পণ্য: '+x.name));db.parties.filter(x=>[x.name,x.mobile].join(' ').toLowerCase().includes(q)).forEach(x=>r.push('পার্টি: '+x.name));[...db.sales,...db.purchases].filter(x=>(x.invoice||'').toLowerCase().includes(q)).forEach(x=>r.push('ইনভয়েস: '+x.invoice));document.getElementById('gres').innerHTML=r.length?r.map(x=>`<div style="padding:9px;border-bottom:1px solid var(--line)">${esc(x)}</div>`).join(''):'কিছু পাওয়া যায়নি'}function notifications(){let low=db.products.filter(p=>stock(p)<=n(p.minimumStock));openModal('Notifications',low.map(p=>`<div class="notice" style="margin-bottom:7px">⚠️ ${esc(p.name)} — স্টক ${stock(p)}</div>`).join('')||'<div class="empty">কোনো নতুন notification নেই।</div>','')}
function modalBody(){return document.getElementById('layers')}function openModal(title,body,foot=''){document.getElementById('layers').innerHTML=`<div class="modal"><section class="modalbox"><div class="mhead"><h2>${title}</h2><button class="ib" onclick="closeLayers()">×</button></div><div class="mbody">${body}</div>${foot?`<div class="mfoot">${foot}</div>`:''}</section></div>`}function fld(name,label,value='',type='text',opts=[]){if(type==='select')return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(o=>typeof o==='string'?`<option value="${esc(o)}" ${value===o?'selected':''}>${esc(o)}</option>`:`<option value="${esc(o.value)}" ${value===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`;return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'step="0.01"':''}></div>`}
function resetAll(){if(confirm('সব ডেটা মুছে ফেলবেন?')){localStorage.removeItem(KEY);location.reload()}}
function auth(){document.getElementById('app').innerHTML=`<div class="auth"><section class="authbox"><div class="logo">হিসাববাটি</div><div class="sub">Professional Business Accounting & Inventory</div><div class="tabs"><button id="at1" class="sel" onclick="authMode('login')">লগইন</button><button id="at2" onclick="authMode('register')">নতুন অ্যাকাউন্ট</button></div><div id="authForm"></div><div id="authMsg" class="authmsg"></div></section></div>`;authMode('login')}
function authMode(mode){document.getElementById('at1').className=mode==='login'?'sel':'';document.getElementById('at2').className=mode==='register'?'sel':'';document.getElementById('authForm').innerHTML=mode==='login'?`<div class="field"><label>Email</label><input id="ae" type="email" autocomplete="email"></div><div class="field" style="margin-top:9px"><label>৬-ডিজিট PIN</label><input id="ap" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password"></div><button class="btn primary" style="width:100%;margin-top:13px" onclick="loginLocal()">লগইন</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="authForgot()">PIN ভুলে গেছেন?</button>`:`<div class="field"><label>Email</label><input id="ne" type="email" autocomplete="email"></div><div class="field" style="margin-top:9px"><label>৬-ডিজিট PIN</label><input id="np" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></div><div class="field" style="margin-top:9px"><label>PIN আবার দিন</label><input id="np2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></div><button class="btn primary" style="width:100%;margin-top:13px" onclick="registerLocal()">অ্যাকাউন্ট তৈরি করুন</button><p style="font-size:11px;color:var(--muted);text-align:center">OTP / Verification Code লাগবে না।</p>`;msg('')}
function msg(t){document.getElementById('authMsg').textContent=t}function validPin(p){return /^\d{6}$/.test(p)}function loginLocal(){let e=document.getElementById('ae').value.trim().toLowerCase(),p=document.getElementById('ap').value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)||!validPin(p))return msg('সঠিক Email এবং ঠিক ৬ ডিজিট PIN দিন');let u=db.users.find(x=>x.email===e&&x.pin===p);if(!u)return msg('Email অথবা PIN সঠিক নয়');db.session={userId:u.id};save();render()}function registerLocal(){let e=document.getElementById('ne').value.trim().toLowerCase(),p=document.getElementById('np').value.trim(),p2=document.getElementById('np2').value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)||!validPin(p)||p!==p2)return msg('সঠিক Email এবং একই ৬ ডিজিট PIN দিন');if(db.users.some(x=>x.email===e))return msg('এই Email দিয়ে অ্যাকাউন্ট আছে');let u={id:uid('USR'),email:e,pin:p,role:'Owner',createdAt:now()};db.users.push(u);db.session={userId:u.id};save();businessForm()}
function authForgot(){openModal('PIN পুনরুদ্ধার',`<div class="notice">আপনার ইমেইলে standard reset link পাঠানো হবে। নতুন PIN অবশ্যই ৬ ডিজিট হবে।</div><div class="field" style="margin-top:10px"><label>Email</label><input id="resetEmail" type="email"></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="sendReset()">Reset Link পাঠান</button>`,'')}function sendReset(){let e=document.getElementById('resetEmail').value.trim();if(!e)return toast('Email দিন');if(window.firebaseSendReset)window.firebaseSendReset(e);else{closeLayers();toast('Firebase Auth configuration চালু না থাকায় reset email পাঠানো যায়নি')}}
function logout(){if(window.firebaseLogout)window.firebaseLogout();db.session=null;save();render()}
</script>
