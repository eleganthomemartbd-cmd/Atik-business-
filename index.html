<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7257F5">
<title>Atik Business Hisab</title>

<style>
:root{
  --primary:#7257f5;
  --primary2:#8b6cff;
  --primary-soft:#eeeaff;
  --bg:#f7f7fb;
  --card:#fff;
  --text:#252638;
  --muted:#777b8f;
  --border:#e7e7ef;
  --success:#16a878;
  --danger:#ed4b4b;
  --warning:#efa900;
  --blue:#3895ed;
  --shadow:0 7px 25px rgba(50,35,120,.08);
  --radius:16px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    "Noto Sans Bengali",
    "Hind Siliguri",
    "SolaimanLipi",
    Arial,
    sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.hidden{
  display:none!important;
}

.app{
  min-height:100vh;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  height:64px;
  background:linear-gradient(
    135deg,
    var(--primary),
    var(--primary2)
  );
  color:#fff;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 18px;
  box-shadow:0 4px 18px #0002;
}

.menu-btn{
  border:0;
  background:transparent;
  color:#fff;
  font-size:27px;
  width:42px;
  height:42px;
  border-radius:10px;
}

.menu-btn:hover{
  background:#fff2;
}

.brand{
  font-size:21px;
  font-weight:800;
}

.brand span{
  opacity:.85;
  font-weight:500;
}

.top-actions{
  margin-left:auto;
  display:flex;
  gap:6px;
}

.top-icon{
  border:0;
  background:transparent;
  color:#fff;
  font-size:20px;
  width:40px;
  height:40px;
  border-radius:10px;
}

.top-icon:hover{
  background:#fff2;
}

/* =========================
   LAYOUT
========================= */

.layout{
  display:flex;
  min-height:calc(100vh - 64px);
}

.sidebar{
  position:fixed;
  left:0;
  top:64px;
  bottom:0;
  width:260px;
  background:var(--card);
  border-right:1px solid var(--border);
  overflow-y:auto;
  padding:12px;
  z-index:90;
}

.main{
  margin-left:260px;
  width:calc(100% - 260px);
  padding:20px;
  max-width:1600px;
}

/* =========================
   PROFILE
========================= */

.profile-box{
  background:linear-gradient(
    135deg,
    #7257f5,
    #8b6cff
  );
  color:#fff;
  padding:18px;
  border-radius:17px;
  margin-bottom:14px;
}

.profile-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#ffffff33;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  margin-bottom:9px;
}

.profile-box h3{
  font-size:18px;
}

.profile-box small{
  opacity:.85;
}

.business-select{
  width:100%;
  border:0;
  margin-top:12px;
  padding:10px;
  border-radius:12px;
  background:#fff;
  color:#333;
  outline:0;
}

/* =========================
   NAVIGATION
========================= */

.nav-title{
  color:#999dae;
  font-size:11px;
  font-weight:700;
  padding:13px 11px 6px;
}

.nav-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#55596d;
  padding:12px 11px;
  border-radius:11px;
  display:flex;
  align-items:center;
  gap:11px;
  text-align:left;
  margin:2px 0;
}

.nav-btn:hover,
.nav-btn.active{
  background:var(--primary-soft);
  color:var(--primary);
  font-weight:700;
}

.nav-icon{
  width:26px;
  text-align:center;
  font-size:19px;
}

/* =========================
   PAGE
========================= */

.page-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}

.page-head h1{
  font-size:26px;
}

.page-head p{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

/* =========================
   BUTTONS
========================= */

.btn{
  border:0;
  border-radius:11px;
  padding:11px 16px;
  background:var(--primary);
  color:#fff;
  font-weight:700;
}

.btn:hover{
  filter:brightness(.96);
}

.btn.secondary{
  background:var(--primary-soft);
  color:var(--primary);
}

.btn.success{
  background:var(--success);
}

.btn.danger{
  background:var(--danger);
}

.btn.warning{
  background:var(--warning);
}

.btn.blue{
  background:var(--blue);
}

.btn.light{
  background:#eef0f5;
  color:#4f5365;
}

/* =========================
   CARDS
========================= */

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:17px;
  box-shadow:var(--shadow);
}

.grid{
  display:grid;
  gap:14px;
}

.stats{
  grid-template-columns:
    repeat(4,minmax(0,1fr));
}

.stat{
  min-height:115px;
}

.stat-icon{
  float:right;
  font-size:27px;
}

.stat-label{
  color:var(--muted);
  font-size:13px;
}

.stat-value{
  font-size:24px;
  font-weight:800;
  margin-top:9px;
}

.stat-sub{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}

.two{
  grid-template-columns:
    repeat(2,minmax(0,1fr));
}

.three{
  grid-template-columns:
    repeat(3,minmax(0,1fr));
}

.four{
  grid-template-columns:
    repeat(4,minmax(0,1fr));
}

.section{
  margin-top:16px;
}

.section-title{
  font-size:18px;
  margin-bottom:12px;
}

/* =========================
   DASHBOARD HERO
========================= */

.hero{
  background:linear-gradient(
    135deg,
    #7055f3,
    #886aff
  );
  color:#fff;
  padding:20px;
  border-radius:20px;
  margin-bottom:15px;
}

.hero-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.hero-label{
  font-size:14px;
  opacity:.9;
}

.hero-value{
  font-size:30px;
  font-weight:800;
  margin-top:3px;
}

.hero-eye{
  font-size:25px;
}

.hero-row{
  margin-top:16px;
  background:#fff;
  color:#333;
  border-radius:15px;
  padding:13px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.hero-mini{
  display:flex;
  align-items:center;
  gap:10px;
}

.hero-mini-icon{
  width:40px;
  height:40px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:#e9fff6;
  color:var(--success);
  font-size:20px;
}

.hero-mini:last-child .hero-mini-icon{
  background:#fff0f0;
  color:var(--danger);
}

.hero-mini small{
  color:var(--muted);
}

.hero-mini strong{
  display:block;
  margin-top:2px;
}

/* =========================
   TABLE
========================= */

.table-wrap{
  width:100%;
  overflow:auto;
  border:1px solid var(--border);
  border-radius:13px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:720px;
  background:var(--card);
}

th,
td{
  padding:11px 12px;
  border-bottom:1px solid var(--border);
  font-size:13px;
  text-align:left;
  white-space:nowrap;
}

th{
  color:#73778b;
  background:#fafaff;
  font-weight:700;
}

tr:last-child td{
  border-bottom:0;
}

.text-right{
  text-align:right;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:38px 15px;
}

/* =========================
   FORM
========================= */

.form-grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:12px;
}

.full{
  grid-column:1/-1;
}

.field label{
  display:block;
  color:#686c7e;
  font-size:12px;
  font-weight:700;
  margin-bottom:6px;
}

input,
select,
textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid #dddfea;
  border-radius:10px;
  background:#fff;
  color:var(--text);
  outline:0;
}

textarea{
  resize:vertical;
  min-height:90px;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px #7257f51b;
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
}

/* =========================
   SEARCH
========================= */

.search-row{
  display:flex;
  gap:8px;
  margin-bottom:12px;
  flex-wrap:wrap;
}

.search-row input{
  flex:1;
  min-width:180px;
}

/* =========================
   BADGES
========================= */

.badge{
  display:inline-flex;
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
}

.badge.success{
  background:#e2f8ef;
  color:#12845c;
}

.badge.danger{
  background:#ffe5e4;
  color:#bb3431;
}

.badge.warning{
  background:#fff1cf;
  color:#9d6900;
}

.badge.info{
  background:#e9e6ff;
  color:#5b43d9;
}

.badge.gray{
  background:#eeeef3;
  color:#656979;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:#11102699;
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:14px;
}

.modal-box{
  width:min(760px,100%);
  max-height:93vh;
  overflow:auto;
  background:var(--card);
  border-radius:19px;
  padding:20px;
  box-shadow:0 25px 80px #0004;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
}

.modal-head h2{
  font-size:20px;
}

.close-btn{
  border:0;
  width:36px;
  height:36px;
  border-radius:9px;
  background:#eef0f5;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:300;
  background:#202337;
  color:#fff;
  padding:12px 17px;
  border-radius:11px;
  box-shadow:0 8px 30px #0003;
  opacity:0;
  pointer-events:none;
  transform:translateY(15px);
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:none;
}

/* =========================
   POS
========================= */

.pos-items{
  margin-top:12px;
}

.sale-item{
  display:grid;
  grid-template-columns:
    2fr .8fr .9fr .9fr 40px;
  gap:8px;
  align-items:end;
  padding:10px;
  background:#fafaff;
  border:1px solid var(--border);
  border-radius:12px;
  margin-bottom:8px;
}

.sale-total-box{
  background:#f4f1ff;
  border-radius:15px;
  padding:15px;
  margin-top:15px;
}

.total-line{
  display:flex;
  justify-content:space-between;
  padding:5px 0;
}

.total-line.grand{
  border-top:1px solid #ddd5ff;
  margin-top:7px;
  padding-top:11px;
  font-size:20px;
  font-weight:800;
  color:var(--primary);
}

/* =========================
   QUICK CARDS
========================= */

.quick-grid{
  display:grid;
  grid-template-columns:
    repeat(4,minmax(0,1fr));
  gap:13px;
}

.quick-card{
  border:1px solid var(--border);
  background:var(--card);
  padding:18px;
  border-radius:15px;
  text-align:center;
  box-shadow:var(--shadow);
}

.quick-card .qicon{
  font-size:27px;
  margin-bottom:7px;
}

.quick-card strong{
  display:block;
}

/* =========================
   REPORT
========================= */

.report-box{
  min-height:110px;
}

.report-number{
  font-size:24px;
  font-weight:800;
  margin-top:8px;
}

/* =========================
   LOGIN
========================= */

.login-screen{
  position:fixed;
  inset:0;
  z-index:1000;
  background:
    linear-gradient(
      135deg,
      #6650ed,
      #8b6cff
    );
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.login-box{
  width:min(430px,100%);
  background:#fff;
  border-radius:24px;
  padding:28px;
  box-shadow:0 25px 90px #24156b66;
}

.login-logo{
  width:72px;
  height:72px;
  border-radius:20px;
  background:linear-gradient(
    135deg,
    #7257f5,
    #9a7aff
  );
  color:#fff;
  display:grid;
  place-items:center;
  margin:0 auto 15px;
  font-size:32px;
  font-weight:900;
}

.login-box h1{
  text-align:center;
  font-size:25px;
}

.login-box .subtitle{
  text-align:center;
  color:#7c8090;
  font-size:13px;
  margin:7px 0 20px;
}

.auth-error{
  color:var(--danger);
  font-size:13px;
  text-align:center;
  margin-bottom:10px;
}

.login-link{
  text-align:center;
  color:var(--primary);
  font-size:13px;
  margin-top:15px;
  cursor:pointer;
}

/* =========================
   INVOICE
========================= */

.invoice{
  background:#fff;
  color:#222;
  max-width:780px;
  margin:auto;
  padding:25px;
}

.invoice-header{
  display:flex;
  justify-content:space-between;
  gap:20px;
  border-bottom:2px solid #222;
  padding-bottom:15px;
  margin-bottom:15px;
}

.invoice-header h2{
  font-size:25px;
}

.invoice-table{
  width:100%;
  min-width:0;
  margin-top:15px;
}

.invoice-table th,
.invoice-table td{
  border:1px solid #ddd;
}

.invoice-summary{
  width:320px;
  margin-left:auto;
  margin-top:15px;
}

.invoice-summary div{
  display:flex;
  justify-content:space-between;
  padding:5px;
}

.invoice-grand{
  border-top:2px solid #222;
  font-size:20px;
  font-weight:800;
}

/* =========================
   DARK
========================= */

body.dark{
  --bg:#11131a;
  --card:#1a1d26;
  --text:#f1f2f7;
  --muted:#a2a6b6;
  --border:#2c3040;
  --shadow:0 8px 28px #0005;
}

.dark input,
.dark select,
.dark textarea{
  background:#20232d;
  color:#fff;
  border-color:#353949;
}

.dark th{
  background:#222632;
}

.dark .sale-item{
  background:#20232d;
}

.dark .invoice{
  background:#fff;
  color:#222;
}

/* =========================
   MOBILE
========================= */

.bottom-nav{
  display:none;
}

@media(max-width:1100px){

  .stats{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .sidebar{
    width:235px;
  }

  .main{
    margin-left:235px;
    width:calc(100% - 235px);
  }

}

@media(max-width:760px){

  .topbar{
    height:58px;
    padding:0 9px;
  }

  .brand{
    font-size:17px;
  }

  .layout{
    min-height:calc(100vh - 58px);
  }

  .sidebar{
    display:none;
    top:58px;
    width:285px;
    box-shadow:12px 0 40px #0003;
  }

  .sidebar.open{
    display:block;
  }

  .main{
    margin-left:0;
    width:100%;
    padding:12px 12px 82px;
  }

  .stats,
  .two,
  .three,
  .four{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .quick-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .sale-item{
    grid-template-columns:1fr 1fr;
  }

  .sale-item .remove-sale{
    grid-column:2;
  }

  .bottom-nav{
    position:fixed;
    display:flex;
    left:0;
    right:0;
    bottom:0;
    height:64px;
    background:var(--card);
    border-top:1px solid var(--border);
    z-index:95;
    justify-content:space-around;
    padding:5px 3px;
  }

  .bottom-nav button{
    border:0;
    background:transparent;
    color:#777b8b;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:10px;
    gap:2px;
  }

  .bottom-nav button span{
    font-size:20px;
  }

  .bottom-nav button.active{
    color:var(--primary);
    font-weight:800;
  }

  .hero-row{
    grid-template-columns:1fr;
  }

}

@media(max-width:480px){

  .stats{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .stat{
    padding:13px;
  }

  .stat-value{
    font-size:19px;
  }

  .page-head{
    align-items:flex-start;
    flex-direction:column;
  }

  .actions{
    width:100%;
  }

  .actions .btn{
    flex:1;
  }

  .quick-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .invoice{
    padding:12px;
  }

}
</style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginScreen" class="login-screen">

  <div class="login-box">

    <div class="login-logo">A</div>

    <h1>Atik Business Hisab</h1>

    <div class="subtitle">
      আপনার ব্যবসার হিসাব সহজ ও সুন্দরভাবে পরিচালনা করুন
    </div>

    <div id="loginError" class="auth-error"></div>

    <div id="loginForm">

      <div class="field">
        <label>ইমেইল</label>
        <input
          id="loginEmail"
          type="email"
          placeholder="আপনার ইমেইল">
      </div>

      <div class="field" style="margin-top:12px">
        <label>পাসওয়ার্ড</label>
        <input
          id="loginPassword"
          type="password"
          placeholder="পাসওয়ার্ড">
      </div>

      <button
        class="btn"
        style="width:100%;margin-top:12px"
        id="loginBtn">
        লগইন
      </button>

      <div
        class="login-link"
        id="showRegister">
        নতুন অ্যাকাউন্ট তৈরি করুন
      </div>

    </div>


    <div id="registerForm" class="hidden">

      <div class="field">
        <label>আপনার নাম</label>
        <input
          id="registerName"
          placeholder="নাম">
      </div>

      <div class="field" style="margin-top:12px">
        <label>ইমেইল</label>
        <input
          id="registerEmail"
          type="email"
          placeholder="ইমেইল">
      </div>

      <div class="field" style="margin-top:12px">
        <label>পাসওয়ার্ড</label>
        <input
          id="registerPassword"
          type="password"
          placeholder="কমপক্ষে ৬ অক্ষর">
      </div>

      <button
        class="btn"
        style="width:100%;margin-top:12px"
        id="registerBtn">
        অ্যাকাউন্ট তৈরি করুন
      </button>

      <div
        class="login-link"
        id="showLogin">
        আগের অ্যাকাউন্টে লগইন
      </div>

    </div>

  </div>

</div>


<!-- =====================================================
     APPLICATION
===================================================== -->

<div id="app" class="app hidden">

<header class="topbar">

  <button
    class="menu-btn"
    id="menuBtn">
    ☰
  </button>

  <div class="brand">
    হিসাবপাতি
    <span>• Atik Business Hisab</span>
  </div>

  <div class="top-actions">

    <button
      class="top-icon"
      id="themeBtn"
      title="থিম">
      ◐
    </button>

    <button
      class="top-icon"
      id="notifyBtn"
      title="নোটিফিকেশন">
      🔔
    </button>

<script>

/* =========================================================

========================================================= */

const STORAGE_KEY =

/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
  document.getElementById(id);


function uid(prefix="ID"){

  return prefix +
    "-" +
    Date.now().toString(36).toUpperCase() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2,7)
      .toUpperCase();

}


function money(value){

  const currency =
    currentDB().settings.currency || "BDT";

  const n =
    Number(value || 0);

  return currency === "USD"
    ? "$" + n.toFixed(2)
    : "৳ " + n.toFixed(2);

}


function today(){

  return new Date()
    .toISOString()
    .slice(0,10);

}


function now(){

  return new Date()
    .toISOString();

}


function esc(text){

  return String(text ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function toast(text){

  const t = $("toast");

  t.textContent = text;

  t.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(
      ()=>t.classList.remove("show"),
      2200
    );

}


function closeModal(){

  $("modal").classList.add("hidden");

}


function openModal(html){

  $("modalContent").innerHTML = html;

  $("modal").classList.remove("hidden");

}


$("modal").addEventListener(
  "click",
  e=>{

    if(e.target === $("modal")){
      closeModal();
    }

  }
);

/* =========================================================
   CALCULATIONS
========================================================= */

function salesTotal(){

  return currentDB()
    .sales
    .filter(s=>s.status!=="Cancelled")
    .reduce(
      (sum,s)=>sum+Number(s.total||0),
      0
    );

}


function purchaseTotal(){

  return currentDB()
    .purchases
    .filter(p=>p.status!=="Cancelled")
    .reduce(
      (sum,p)=>sum+Number(p.total||0),
      0
    );

}


function expenseTotal(){

  return currentDB()
    .expenses
    .filter(e=>e.status!=="Cancelled")
    .reduce(
      (sum,e)=>sum+Number(e.amount||0),
      0
    );

}


function todaySales(){

  return currentDB()
    .sales
    .filter(
      s=>s.date===today() &&
      s.status!=="Cancelled"

      (sum,s)=>sum+Number(s.total||0),

    )

      (sum,e)=>sum+Number(e.amount||0),

}


/* =========================================================
   STOCK
========================================================= */

function productStock(productId){

  const db =
    currentDB();

  const product =
    db.products.find(
      p=>p.id===productId
    );

  if(!product)
    return 0;


  let stock =
    Number(product.openingStock||0);


  db.purchases
    .filter(
      p=>p.status!=="Cancelled"
    )
    .forEach(p=>{

      p.items
        .filter(
          i=>i.productId===productId
        )
        .forEach(i=>{

          stock +=
            Number(i.qty||0);

        });

    });


  db.sales
    .filter(
      s=>s.status!=="Cancelled"
    )
    .forEach(s=>{

      s.items
        .filter(
          i=>i.productId===productId
        )
        .forEach(i=>{

          stock -=
            Number(i.qty||0);

        });

    });


  db.salesReturns
    .filter(
      r=>r.status!=="Cancelled"
    )
    .forEach(r=>{

      r.items
        .filter(
          i=>i.productId===productId
        )
        .forEach(i=>{

          stock +=
            Number(i.qty||0);

        });

    });


  db.purchaseReturns
    .filter(
      r=>r.status!=="Cancelled"
    )
    .forEach(r=>{

      r.items
        .filter(
          i=>i.productId===productId
        )
        .forEach(i=>{

          stock -=
            Number(i.qty||0);

        });

    });


  db.stockAdjustments
    .filter(
      a=>a.productId===productId &&
      a.status!=="Cancelled"
    )
    .forEach(a=>{

      stock +=
        Number(a.quantity||0);

    });


  return stock;

}


function stockValue(){

  return currentDB()
    .products
    .reduce(
      (sum,p)=>
        sum +
        productStock(p.id) *
        Number(p.purchasePrice||0),
      0
    );

}


/* =========================================================
   COGS
========================================================= */

function cogs(){

  let total = 0;

  currentDB()
    .sales
    .filter(s=>s.status!=="Cancelled")
    .forEach(s=>{

      s.items.forEach(i=>{

        const p =
          currentDB()
            .products
            .find(
              x=>x.id===i.productId
            );

        total +=
          Number(i.qty||0) *
          Number(
            p?.purchasePrice || 0
          );

      });

    });


  return total;

}


function grossProfit(){

  return salesTotal() - cogs();

}


function netProfit(){

  return grossProfit() -
    expenseTotal();

}


/* =========================================================
   RECEIVABLE
========================================================= */

function customerDue(customerId){

  const db =
    currentDB();

  const customer =
    db.customers.find(
      c=>c.id===customerId
    );

  let due =
    Number(
      customer?.openingDue || 0
    );


  db.sales
    .filter(
      s=>
        s.customerId===customerId &&
        s.status!=="Cancelled"
    )
    .forEach(
      s=>{
        due +=
          Number(s.due||0);
      }
    );


  db.payments
    .filter(
      p=>
        p.type==="customer" &&
        p.partyId===customerId &&
        p.status!=="Cancelled"
    )
    .forEach(
      p=>{
        due -=
          Number(p.amount||0);
      }
    );


  return Math.max(0,due);

}


function totalReceivable(){

  return currentDB()
    .customers
    .reduce(
      (sum,c)=>
        sum+customerDue(c.id),
      0
    );

}


/* =========================================================
   PAYABLE
========================================================= */

function supplierDue(supplierId){

  const db =
    currentDB();

  const supplier =
    db.suppliers.find(
      s=>s.id===supplierId
    );

  let due =
    Number(
      supplier?.openingPayable || 0
    );


  db.purchases
    .filter(
      p=>
        p.supplierId===supplierId &&
        p.status!=="Cancelled"
    )
    .forEach(
      p=>{
        due +=
          Number(p.due||0);
      }
    );


  db.payments
    .filter(
      p=>
        p.type==="supplier" &&
        p.partyId===supplierId &&
        p.status!=="Cancelled"
    )
    .forEach(
      p=>{
        due -=
          Number(p.amount||0);
      }
    );


  return Math.max(0,due);

}


function totalPayable(){

  return currentDB()
    .suppliers
    .reduce(
      (sum,s)=>
        sum+supplierDue(s.id),
      0
    );

}


/* =========================================================
   CASH / BANK
========================================================= */

function cashBalance(){

  const db =
    currentDB();

  let balance =
    Number(db.openingCash||0);


  db.sales
    .filter(s=>s.status!=="Cancelled")
    .forEach(s=>{

      if(s.paymentMethod==="cash"){

        balance +=
          Number(s.paid||0);

      }

    });


  db.purchases
    .filter(p=>p.status!=="Cancelled")
    .forEach(p=>{

      if(p.paymentMethod==="cash"){

        balance -=
          Number(p.paid||0);

      }

    });


  db.expenses
    .filter(e=>e.status!=="Cancelled")
    .forEach(e=>{

      if(e.paymentMethod==="cash"){

        balance -=
          Number(e.amount||0);

      }

    });


  db.payments
    .filter(p=>p.status!=="Cancelled")
    .forEach(p=>{

      if(p.method==="cash"){

        if(p.type==="customer")
          balance += Number(p.amount||0);

        if(p.type==="supplier")
          balance -= Number(p.amount||0);

      }

    });


  db.cashTransactions
    .filter(t=>t.status!=="Cancelled")
    .forEach(t=>{

      balance +=
        Number(t.amount||0);

    });


  return balance;

}


function bankBalance(){

  const db =
    currentDB();

  let balance =
    Number(db.openingBank||0);


  db.sales
    .filter(s=>s.status!=="Cancelled")
    .forEach(s=>{

      if(s.paymentMethod==="bank"){

        balance +=
          Number(s.paid||0);

      }

    });


  db.purchases
    .filter(p=>p.status!=="Cancelled")
    .forEach(p=>{

      if(p.paymentMethod==="bank"){

        balance -=
          Number(p.paid||0);

      }

    });


  db.expenses
    .filter(e=>e.status!=="Cancelled")
    .forEach(e=>{

      if(e.paymentMethod==="bank"){

        balance -=
          Number(e.amount||0);

      }

    });


  db.payments
    .filter(p=>p.status!=="Cancelled")
    .forEach(p=>{

      if(p.method==="bank"){

        if(p.type==="customer")
          balance += Number(p.amount||0);

        if(p.type==="supplier")
          balance -= Number(p.amount||0);

      }

    });


  db.bankTransactions
    .filter(t=>t.status!=="Cancelled")
    .forEach(t=>{

      balance +=
        Number(t.amount||0);

    });


  return balance;

}

function saveProduct(id){

  const db =
    currentDB();


  const name =
    $("pName").value.trim();

  const purchase =
    Number($("pPurchase").value);

  const selling =
    Number($("pSelling").value);


  if(!name){

    toast("পণ্যের নাম দিন");

    return;

  }


  if(
    purchase < 0 ||
    selling < 0
  ){

    toast("মূল্য সঠিক দিন");

    return;

  }


  if(id){

    const p =
      db.products.find(
        x=>x.id===id
      );

    Object.assign(
      p,
      {

        name,

        code:$("pCode").value.trim(),

        barcode:$("pBarcode").value.trim(),

        category:$("pCategory").value.trim(),

        brand:$("pBrand").value.trim(),

        unit:$("pUnit").value,

        purchasePrice:purchase,

        sellingPrice:selling,

        minimumStock:
          Number($("pMinimum").value||0),

        description:
          $("pDescription").value.trim(),

        updatedAt:now()

      }
    );


    toast("পণ্য আপডেট হয়েছে");

  }else{

    db.products.push({

      id:uid("PROD"),

      name,

      code:$("pCode").value.trim(),

      barcode:$("pBarcode").value.trim(),

      category:$("pCategory").value.trim(),

      brand:$("pBrand").value.trim(),

      unit:$("pUnit").value,

      purchasePrice:purchase,

      sellingPrice:selling,

      openingStock:
        Number($("pOpening").value||0),

      minimumStock:
        Number($("pMinimum").value||0),

      description:
        $("pDescription").value.trim(),

      createdAt:now(),

      status:"Active"

    });


    toast("নতুন পণ্য যোগ হয়েছে");

  }


  saveDB();

  closeModal();

  renderProducts();

}

function saveStockAdjustment(id){

  const qty =
    Number($("adjustQty").value);

  if(!qty){

    toast("পরিমাণ দিন");

    return;

  }


  const db =
    currentDB();


  if(
    productStock(id)+qty < 0
  ){

    toast("স্টক ০-এর নিচে যেতে পারবে না");

    return;

  }


  db.stockAdjustments.push({

    id:uid("ADJ"),

    productId:id,

    quantity:qty,

    reason:$("adjustReason").value,

    date:today(),

    time:now(),

    status:"Active"

  });


  saveDB();

  closeModal();

  renderProducts();

  toast("স্টক সমন্বয় হয়েছে");

}

  const db =
    currentDB();


  if(!db.products.length){

    toast("আগে একটি পণ্য যোগ করুন");

    navigate("products");

    return;

  }


  saleItems.push({

    id:uid("ROW"),

    productId:
      db.products[0].id,

    qty:1,

    price:
      Number(
        db.products[0].sellingPrice||0
      )

  });


  drawSaleItems();

}

  const db =
    currentDB();


  $("saleItems").innerHTML =

              saleItems[${index}].price=
              Number(
                currentDB().products.find(

                )?.sellingPrice||0
              );
              drawSaleItems();
              calculateSale();
              ">

              ${db.products.map(
                p=>
                `<option
                  value="${p.id}"
                  ${p.id===item.productId?"selected":""}>
                  ${esc(p.name)}
                  — স্টক ${productStock(p.id)}

              ).join("")}

          </div>

            <label>পরিমাণ</label>

            <input
              type="number"
              min="1"

              saleItems[${index}].qty=

              calculateSale();">

            <input
              type="number"
              min="0"
              value="${item.price}"
              onchange="
              saleItems[${index}].price=
              Number(this.value||0);
              calculateSale();">

          </div>


          <div class="field">

            <label>মোট</label>

            <input
              value="${money(
                item.qty*item.price
              )}"
              disabled>

          </div>


          <button
            class="btn danger remove-sale"
            onclick="
            saleItems.splice(${index},1);
            drawSaleItems();
            calculateSale();">
            ✕
          </button>

        </div>

        `;

      }
    ).join("");


  calculateSale();

}


function calculateSale(){

  if(!$("saleSubtotal"))
    return;


  let subtotal =
    saleItems.reduce(
      (sum,i)=>
        sum+
        Number(i.qty||0)*
        Number(i.price||0),
      0
    );


  const discount =
    Number(
      $("saleDiscount").value||0
    );


  const delivery =
    Number(
      $("saleDelivery").value||0
    );


  const tax =
    Number(
      $("saleTax").value||0
    );


  const grand =
    subtotal -
    discount +
    delivery +
    tax;


  const paid =
    Number(
      $("salePaid").value||0
    );


  const due =
    Math.max(
      0,
      grand-paid
    );


  $("saleSubtotal")
    .textContent=money(subtotal);

  $("saleDiscountView")
    .textContent=money(discount);

  $("saleDeliveryView")
    .textContent=money(delivery);

  $("saleTaxView")
    .textContent=money(tax);

  $("saleGrand")
    .textContent=money(grand);

  $("saleDue")
    .textContent=money(due);

}


function completeSale(){

  const db =
    currentDB();


  if(!saleItems.length){

    toast("কমপক্ষে একটি পণ্য যোগ করুন");

    return;

  }


  for(const item of saleItems){

    const stock =
      productStock(
        item.productId
      );

    if(
      Number(item.qty)<=0 ||
      Number(item.qty)>stock
    ){

      const p =
        db.products.find(
          x=>x.id===item.productId
        );

      toast(
        `${p?.name||"পণ্য"}-এর পর্যাপ্ত স্টক নেই`
      );

      return;

    }

  }


  const subtotal =
    saleItems.reduce(
      (s,i)=>
        s+
        Number(i.qty)*Number(i.price),
      0
    );


  const discount =
    Number(
      $("saleDiscount").value||0
    );


  const delivery =
    Number(
      $("saleDelivery").value||0
    );


  const tax =
    Number(
      $("saleTax").value||0
    );


  const total =
    subtotal-
    discount+
    delivery+
    tax;


  const paid =
    Number(
      $("salePaid").value||0
    );


  if(paid>total){

    toast(
      "Paid amount মোটের চেয়ে বেশি হতে পারবে না"
    );

    return;

  }


  const customerId =
    $("saleCustomer").value;


  const method =
    $("salePaymentMethod").value;


  if(
    paid < total &&
    !customerId
  ){

    toast(
      "বাকি বিক্রয়ের জন্য কাস্টমার নির্বাচন করুন"
    );

    return;

  }


  const customer =
    db.customers.find(
      c=>c.id===customerId
    );


  const sale = {

    id:uid("SALE"),

    invoiceNo:
      $("saleInvoice").value.trim() ||
      uid("INV"),

    date:
      $("saleDate").value,

    createdAt:now(),

    customerId:

      customerId || "",

    customerName:

      customer?.name ||
      "Walk-in Customer",

    items:
      saleItems.map(
        i=>({

          productId:i.productId,

          qty:Number(i.qty),

          price:Number(i.price),

          total:
            Number(i.qty)*
            Number(i.price)

        })
      ),

    subtotal,

    discount,

    delivery,

    tax,

    total,

    paid,

    due:

      total-paid,

    paymentMethod:
      method,

    status:"Completed"

  };


  db.sales.push(sale);


  db.invoices.push({

    id:uid("INVOICE"),

    invoiceNo:sale.invoiceNo,

    saleId:sale.id,

    date:sale.date,

    createdAt:now(),

    status:"Active"

  });


  db.auditHistory.push({

    id:uid("AUDIT"),

    action:"SALE_CREATED",

    reference:sale.id,

    date:today(),

    time:now()

  });


  saveDB();


  toast(
    "বিক্রয় সফলভাবে সম্পন্ন হয়েছে"
  );


  showInvoice(sale.id);

}

function saveCashTransaction(type){

  const amount =
    Number(
      $("ctAmount").value
    );


  if(amount<=0){

    toast("সঠিক পরিমাণ দিন");

    return;

  }


  const signed =
    $("ctType").value==="in"
    ? amount
    : -amount;


  const transaction = {

    id:uid(
      type==="cash"
      ?"CASH"
      :"BANK"
    ),

    amount:signed,

    description:
      $("ctDescription")
        .value
        .trim(),

    date:today(),

    createdAt:now(),

    status:"Active"

  };


  if(type==="cash"){

    currentDB()
      .cashTransactions
      .push(transaction);

  }else{

    currentDB()
      .bankTransactions
      .push(transaction);

  }


  saveDB();

  closeModal();

  renderCash();

  toast("লেনদেন সংরক্ষণ হয়েছে");

}

  const db =

      ?db.customers
      :db.suppliers

    .find(
      p=>p.id===partyId
    );


  const order = {

    id:uid(
      type==="sales"
      ?"SO"
      :"PO"
    ),

    date:
      $("orderDate").value,

    partyId,

    party:
      party?.name||"",

    status:
      $("orderStatus").value,

    note:
      $("orderNote").value,

    createdAt:now()

  };


  if(type==="sales")
    db.salesOrders.push(order);

  else
    db.purchaseOrders.push(order);


  saveDB();

  closeModal();

  renderOrders();

  toast("অর্ডার সংরক্ষণ হয়েছে");

function generateReport(){

  const from =
    $("reportFrom").value;

  const to =
    $("reportTo").value;


  const db =
    currentDB();


  const sales =
    db.sales.filter(
      s=>
        s.date>=from &&
        s.date<=to &&
        s.status!=="Cancelled"
    );


  const purchases =
    db.purchases.filter(
      p=>
        p.date>=from &&
        p.date<=to &&
        p.status!=="Cancelled"
    );


  const expenses =
    db.expenses.filter(
      e=>
        e.date>=from &&
        e.date<=to &&
        e.status!=="Cancelled"
    );


  const st =
    sales.reduce(
      (a,s)=>
        a+Number(s.total||0),
      0
    );


  const pt =
    purchases.reduce(
      (a,p)=>
        a+Number(p.total||0),
      0
    );


  const et =
    expenses.reduce(
      (a,e)=>
        a+Number(e.amount||0),
      0
    );


  $("reportResult").innerHTML = `

    <div class="grid three">

      <div class="card">

        <small>
          ${from} → ${to}
        </small>

        <div class="report-number">
          ${money(st)}
        </div>

        <div class="small">
          Sales
        </div>

      </div>


      <div class="card">

        <div class="report-number">
          ${money(pt)}
        </div>

        <div class="small">
          Purchases
        </div>

      </div>


      <div class="card">

        <div class="report-number">
          ${money(et)}
        </div>

        <div class="small">
          Expenses
        </div>

      </div>

    </div>


    <div class="card section">

      <h2 class="section-title">
        Profit & Loss
      </h2>

      <div class="total-line">

        <span>Sales Revenue</span>

        <strong>${money(st)}</strong>

      </div>


      <div class="total-line">

        <span>COGS</span>

        <strong>
          ${money(
            sales.reduce(
              (sum,s)=>
                sum+
                s.items.reduce(
                  (a,i)=>{

                    const p =
                      db.products.find(
                        x=>x.id===i.productId
                      );

                    return a+
                      Number(i.qty||0)*
                      Number(
                        p?.purchasePrice||0
                      );

                  },
                  0
                ),
              0
            )
          )}
        </strong>

      </div>


      <div class="total-line grand">

        <span>Net Profit</span>

        <strong>
          ${money(
            st-et-
            sales.reduce(
              (sum,s)=>
                sum+
                s.items.reduce(
                  (a,i)=>{

                    const p =
                      db.products.find(
                        x=>x.id===i.productId
                      );

                    return a+
                      Number(i.qty||0)*
                      Number(
                        p?.purchasePrice||0
                      );

                  },
                  0
                ),
              0
            )
          )}
        </strong>

      </div>

    </div>


    <div class="card section">

      <h2 class="section-title">
        Transaction Report
      </h2>

      <div class="table-wrap">

      <table>

      <thead>

      <tr>
        <th>তারিখ</th>
        <th>ধরন</th>
        <th>রেফারেন্স</th>
        <th>পরিমাণ</th>
      </tr>

      </thead>

      <tbody>

      ${sales.map(
        s=>`

        <tr>

          <td>${s.date}</td>

          <td>বিক্রয়</td>

          <td>${esc(s.invoiceNo)}</td>

          <td>${money(s.total)}</td>

        </tr>

        `
      ).join("")}


      ${purchases.map(
        p=>`

        <tr>

          <td>${p.date}</td>

          <td>ক্রয়</td>

          <td>${esc(p.id)}</td>

          <td>${money(p.total)}</td>

        </tr>

        `
      ).join("")}


      ${expenses.map(
        e=>`

        <tr>

          <td>${e.date}</td>

          <td>খরচ</td>

          <td>${esc(e.category)}</td>

          <td>${money(e.amount)}</td>

        </tr>

        `
      ).join("")}

      </tbody>

      </table>

      </div>

    </div>

  `;

}

/* =========================================================
   BACKUP / RESTORE
========================================================= */

function downloadFile(
  content,
  filename,
  type="text/plain"
){

  const blob =
    new Blob(
      [content],
      {type}
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");

  a.href=url;

  a.download=filename;

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

}


function backupJSON(){

  downloadFile(

    JSON.stringify(
      DB,
      null,
      2
    ),

    "atik-business-hisab-backup.json",

    "application/json"

  );


  toast("JSON Backup তৈরি হয়েছে");

}


function restoreJSON(event){

  const file =
    event.target.files[0];


  if(!file)
    return;


  if(
    !confirm(
      "Restore করলে বর্তমান ডাটা পরিবর্তিত হতে পারে। আপনি কি নিশ্চিত?"
    )
  )
    return;


  const reader =
    new FileReader();


  reader.onload =
    e=>{

      try{

        const data =
          JSON.parse(
            e.target.result
          );


        if(
          !data.businesses ||
          !data.activeBusinessId
        ){

          throw new Error(
            "Invalid backup"
          );

        }


        DB=data;

        saveDB();

        renderSidebar();

        navigate("dashboard");

        toast("Backup Restore সফল হয়েছে");

      }catch(error){

        alert(
          "Backup file সঠিক নয়।"
        );

      }

    };


  reader.readAsText(file);

}


function exportCSV(){

  const db =
    currentDB();


  const rows = [

    [
      "Date",
      "Type",
      "Reference",
      "Party",
      "Amount",
      "Status"
    ]

  ];


  db.sales.forEach(
    s=>
    rows.push([
      s.date,
      "Sale",
      s.invoiceNo,
      s.customerName,
      s.total,
      s.status
    ])
  );


  db.purchases.forEach(
    p=>
    rows.push([
      p.date,
      "Purchase",
      p.id,
      p.supplierName,
      p.total,
      p.status
    ])
  );


  db.expenses.forEach(
    e=>
    rows.push([
      e.date,
      "Expense",
      e.id,
      e.category,
      e.amount,
      e.status
    ])
  );


  const csv =
    rows
      .map(
        row=>
        row
          .map(
            v=>
            `"${String(v??"")
              .replace(/"/g,'""')}"`
          )
          .join(",")
      )
      .join("\n");


  downloadFile(
    "\uFEFF"+csv,
    "atik-business-report.csv",
    "text/csv;charset=utf-8"
  );


  toast("CSV Export হয়েছে");

}
